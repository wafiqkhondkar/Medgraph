<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MedGraph Handwriting Lab</title>
<style>
:root{
  --bg:#e9ecef;--surface:#fff;--surface2:#f5f7f9;--ink:#12171c;--muted:#5c6873;
  --line:#d3d9df;--line2:#e5eaee;--ok:#15803d;--warn:#b45309;--err:#b91c1c;
  --accent:#4f46e5;--purple:#6b46c1;--r:7px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.04em;text-transform:uppercase}.brand small{display:block;font-size:9px;opacity:.55;letter-spacing:.13em}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.hbtn,.tab{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:5px;padding:6px 10px;font-weight:650;font-size:12px}
.tab.on,.hbtn.solid{background:#fff;color:var(--ink);border-color:#fff}
.hright{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.status{font-size:11px;opacity:.72}
main{max-width:1240px;margin:0 auto;padding:16px 16px 70px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}.ph h2{font-size:17px;margin:0}.ph h3{font-size:15px;margin:0}
.hint{font-size:11.5px;color:var(--muted)}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:850px){.grid2,.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.hright{margin-left:0;width:100%}}
.fld{display:grid;gap:4px;margin-bottom:9px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:5px;padding:8px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 2px rgba(18,23,28,.08)}
.btn,.mini{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:5px;padding:8px 13px;font-weight:700}
.btn.ghost,.mini{background:#fff;color:var(--ink);border-color:var(--line)}.mini{padding:5px 9px;font-size:12px}
.mini.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mini.danger{color:var(--err);border-color:#edc4c4}.btn:disabled,.mini:disabled{opacity:.42;cursor:default}
.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--surface2);border:1px solid var(--line2);border-radius:6px;padding:10px}.metric b{font-size:20px;display:block}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:750}
.notice{padding:9px 11px;border:1px solid #d7d9f5;background:#f7f7ff;border-left:3px solid var(--accent);border-radius:5px;font-size:12px}
.warn{border-color:#ecd6ad;background:#fffaf0;border-left-color:var(--warn)}
.ok{border-color:#b9dfc4;background:#f4fbf6;border-left-color:var(--ok)}
.canvaswrap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
canvas.ink{display:block;width:100%;height:440px;touch-action:none;background:#fff}
.canvasbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.prompt{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:9px}
.prompt .big{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:24px;font-weight:700;margin-top:4px;white-space:pre-wrap}
.progress{height:7px;background:var(--line2);border-radius:20px;overflow:hidden;margin-top:8px}.progress>i{display:block;height:100%;background:var(--ok)}
.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line2);padding:7px 8px;text-align:left;vertical-align:top;font-size:12px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:100px;padding:2px 7px;font-size:10px;font-weight:700;background:#fff}
.pill.real{color:var(--ok);border-color:#b8ddc0}.pill.syn{color:var(--purple);border-color:#cfbfeb}.pill.auto{color:var(--warn);border-color:#e6cfac}
.seglist{display:grid;gap:7px}.segrow{border:1px solid var(--line);border-radius:5px;padding:7px 9px;background:#fff}.segrow.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bar{height:8px;background:var(--line2);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}@media(max-width:850px){.cards{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:6px;padding:10px;background:#fff}
.previewgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:700px){.previewgrid{grid-template-columns:1fr}}
.previewitem{border:1px solid var(--line);border-radius:6px;padding:8px}.previewitem canvas{width:100%;height:170px;display:block;background:#fff;border:1px solid var(--line2);border-radius:4px}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.kbd{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;background:var(--surface2);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.hidden{display:none!important}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}@media(max-width:920px){.split{grid-template-columns:1fr}}
.scrollbox{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:5px}
.sticky{position:sticky;top:70px}
input[type=range]{padding:0}
footer{font-size:11px;color:var(--muted);text-align:center;padding:20px}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#12171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedGraph Lab">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

</head>
<body>
<header>
  <div class="brand">Handwriting Lab<small>for MedGraph</small></div><button class="hbtn" onclick="location.href='./index.html'">← MedGraph</button>
  <div class="tabs" id="tabs"></div>
  <div class="hright">
    <span class="status" id="save-status">local</span>
    <button class="hbtn" onclick="importClick()">Import MedGraph</button>
    <button class="hbtn solid" onclick="exportMedGraph()">Export MedGraph</button>
    <input id="file-in" type="file" accept=".json,application/json" hidden onchange="importFile(this.files[0]);this.value=''">
  </div>
</header>
<main id="app"></main>
<footer>Local-first companion trainer. Synthetic handwriting is stroke-based augmentation, not a neural image generator.</footer>

<script>
'use strict';

/* ---------- state ---------- */
const LS='medgraph_handwriting_lab_v1';
const TABS=[['dash','Dashboard'],['collect','Collect'],['segment','Segment'],['generate','Generate'],['test','Test'],['data','Data']];
let S={
  tab:'dash',
  graph:null,
  standalone:{defs:[],whiteboard:{training:{samples:[]}}},
  selectedSample:null,
  canvas:{strokes:[],active:null,tool:'pen',panX:0,panY:0,zoom:1,fingerDraw:false},
  guided:{active:false,set:'lower',reps:5,queue:[],i:0,saved:0},
  segment:{sampleId:null,angle:null,selectedWordKey:'0:0',overrides:{}},
  gen:{text:'adaptive immunity',count:6,augment:10,slant:7,size:12,spacing:12,jitter:1.4,previews:[]},
  validation:[],
  test:{strokes:[],active:null,truth:'',result:null}
};
const uid=p=>p+'_'+Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const canon=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^\p{L}\d]+/gu,' ').trim().replace(/\s+/g,' ');
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));document.getElementById('save-status').textContent='saved locally'}catch(e){document.getElementById('save-status').textContent='memory only'}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(LS)||'null');if(x)S={...S,...x,canvas:{...S.canvas,...(x.canvas||{}),active:null},test:{...S.test,...(x.test||{}),active:null}}}catch(e){}}
function graph(){return S.graph||S.standalone}
function training(){const G=graph();G.whiteboard=G.whiteboard||{};G.whiteboard.training=G.whiteboard.training||{};G.whiteboard.training.samples=G.whiteboard.training.samples||[];G.whiteboard.training.lab=G.whiteboard.training.lab||{};return G.whiteboard.training}
function samples(){return training().samples}
function defs(){return graph().defs||[]}
function vocab(){const out=[];defs().forEach(d=>{if(d?.term)out.push(d.term);(d?.aliases||[]).forEach(a=>out.push(a))});return [...new Set(out)]}
function toast(msg){let d=document.createElement('div');d.textContent=msg;d.style.cssText='position:fixed;z-index:9999;bottom:18px;left:50%;transform:translateX(-50%);background:#12171c;color:#fff;padding:8px 14px;border-radius:100px;font-weight:700;font-size:12px;box-shadow:0 5px 20px #0004';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function download(name,text,type='application/json'){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importClick(){document.getElementById('file-in').click()}
async function importFile(f){
  if(!f)return;
  try{
    const x=JSON.parse(await f.text());
    const incoming=x.graph||x;
    if(!incoming||typeof incoming!=='object')throw Error('Not a JSON object');
    if(incoming.defs||incoming.rels||incoming.seqs||incoming.whiteboard){
      if(S.graph && !confirm('Replace the currently loaded MedGraph? Training samples from the new file will be kept with that graph.'))return;
      S.graph=incoming;training();
      saveLocal();render();toast(`Loaded MedGraph · ${defs().length} terms · ${samples().length} training samples`);
    }else if(x.samples){
      mergeTrainingPack(x);saveLocal();render();toast('Training pack merged');
    }else throw Error('This does not look like a MedGraph export or Handwriting Lab pack');
  }catch(e){alert('Could not import file:\\n'+e.message)}
}
function mergeTrainingPack(x){
  const T=samples(),seen=new Set(T.map(a=>(a.id||'')+'|'+(a.category||'')+'|'+(a.label||'')));
  let n=0;(x.samples||[]).forEach(a=>{const k=(a.id||'')+'|'+(a.category||'')+'|'+(a.label||'');if(!seen.has(k)){T.push(a);seen.add(k);n++}});
  if(x.validation)S.validation.push(...x.validation.filter(v=>!S.validation.some(z=>z.id===v.id)));
  return n
}
function exportMedGraph(){
  const G=graph();
  if(!G){toast('Nothing to export');return}
  training().lab={...(training().lab||{}),lastLabExport:Date.now(),validation:S.validation};
  download('medgraph_with_handwriting_training.json',JSON.stringify(G,null,2));
}
function exportPack(){download('medgraph_handwriting_training_pack.json',JSON.stringify({version:1,created:Date.now(),samples:samples(),validation:S.validation},null,2))}
function resetLab(){if(!confirm('Reset the Handwriting Lab local workspace? This does not alter any file you already exported.'))return;localStorage.removeItem(LS);location.reload()}

/* ---------- stroke utilities ---------- */
function boundsPts(pts){let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;(pts||[]).forEach(p=>{minx=Math.min(minx,p.x);miny=Math.min(miny,p.y);maxx=Math.max(maxx,p.x);maxy=Math.max(maxy,p.y)});if(!isFinite(minx))return{x:0,y:0,w:0,h:0};return{x:minx,y:miny,w:maxx-minx,h:maxy-miny}}
function sb(st){return st.b||boundsPts(st.pts)}
function union(bs){if(!bs.length)return{x:0,y:0,w:0,h:0};let x=Math.min(...bs.map(b=>b.x)),y=Math.min(...bs.map(b=>b.y)),x2=Math.max(...bs.map(b=>b.x+b.w)),y2=Math.max(...bs.map(b=>b.y+b.h));return{x,y,w:x2-x,h:y2-y}}
function strokeLen(st){let n=0,p=st.pts||[];for(let i=1;i<p.length;i++)n+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return n}
function normalizeStrokes(strokes){
  if(!strokes?.length)return[];
  const b=union(strokes.map(sb)),den=Math.max(1,b.w,b.h);
  return strokes.map(st=>({pts:(st.pts||[]).map(p=>[+( (p.x-b.x)/den).toFixed(4),+( (p.y-b.y)/den).toFixed(4),+(p.p??.5).toFixed(3)])}))
}
function denormalize(compact,x=0,y=0,scale=100,rot=0,sx=1,sy=1,jitter=0){
  const cs=Math.cos(rot),sn=Math.sin(rot),out=[];
  (compact||[]).forEach(st=>{
    const pts=(st.pts||[]).map(q=>{
      let xx=q[0]*scale*sx,yy=q[1]*scale*sy;
      if(jitter){xx+=(Math.random()*2-1)*jitter;yy+=(Math.random()*2-1)*jitter}
      return{x:x+xx*cs-yy*sn,y:y+xx*sn+yy*cs,p:q[2]??.5}
    });if(pts.length>1)out.push({id:uid('st'),pts,b:boundsPts(pts)})
  });return out
}
function signature(strokes){
  const N=24,c=document.createElement('canvas');c.width=N;c.height=N;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,N,N);
  const b=union(strokes.map(sb));if(!b.w&&!b.h)return[];
  const sc=Math.min((N-4)/Math.max(1,b.w),(N-4)/Math.max(1,b.h)),ox=(N-b.w*sc)/2,oy=(N-b.h*sc)/2;
  x.strokeStyle='#000';x.lineWidth=1.7;x.lineCap='round';x.lineJoin='round';
  strokes.forEach(st=>{const p=st.pts||[];if(p.length<2)return;x.beginPath();p.forEach((q,i)=>{const xx=ox+(q.x-b.x)*sc,yy=oy+(q.y-b.y)*sc;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()});
  const d=x.getImageData(0,0,N,N).data,a=[];for(let i=0;i<N*N;i++)if(d[i*4]<210)a.push(i);return a
}
function sigSim(a,b){if(!a?.length||!b?.length)return 0;const A=new Set(a),B=new Set(b);let n=0;A.forEach(v=>{if(B.has(v))n++});return n/Math.max(1,A.size+B.size-n)}
function dirHist(strokes){
  const h=Array(8).fill(0);let total=0;
  strokes.forEach(st=>{const p=st.pts||[];for(let i=1;i<p.length;i++){const dx=p[i].x-p[i-1].x,dy=p[i].y-p[i-1].y,l=Math.hypot(dx,dy);if(l<.2)continue;let a=Math.atan2(dy,dx);if(a<0)a+=Math.PI*2;h[Math.floor(a/(Math.PI/4))%8]+=l;total+=l}});
  return h.map(x=>x/Math.max(1,total))
}
function feat(strokes){
  if(!strokes?.length)return[];
  const b=union(strokes.map(sb)),diag=Math.max(1,Math.hypot(b.w,b.h)),lens=strokes.map(strokeLen),tot=lens.reduce((a,x)=>a+x,0);
  let close=0;strokes.forEach(st=>{const p=st.pts||[];if(p.length>1)close+=Math.hypot(p[0].x-p.at(-1).x,p[0].y-p.at(-1).y)/Math.max(1,strokeLen(st))});close/=strokes.length;
  return[Math.min(1,strokes.length/12),Math.min(3,b.w/Math.max(1,b.h))/3,Math.min(3,b.h/Math.max(1,b.w))/3,Math.min(4,tot/diag)/4,Math.min(1,close),...dirHist(strokes)]
}
function storeSample(category,label,strokes,meta={},source='lab-real'){
  const sm={id:uid('lab'),category,label:String(label||'').trim(),sig:signature(strokes),strokes:normalizeStrokes(strokes),features:feat(strokes),meta:{weight:1,...meta},source,created:Date.now()};
  samples().push(sm);return sm
}
function sampleWeight(s){if(s?.meta?.weight!=null)return +s.meta.weight;return s.source==='synthetic'?.25:s.category==='letter_auto'?.55:1}
function sampleAsStrokes(s){return denormalize(s.strokes,0,0,100)}

/* ---------- geometry / line-word segmentation ---------- */
function rotateStrokes(strokes,angle,cx,cy){
  const cs=Math.cos(angle),sn=Math.sin(angle);
  return strokes.map(st=>{const pts=st.pts.map(p=>{const dx=p.x-cx,dy=p.y-cy;return{x:cx+dx*cs-dy*sn,y:cy+dx*sn+dy*cs,p:p.p}});return{...st,pts,b:boundsPts(pts)}})
}
function estimateAngle(strokes){
  const centers=strokes.map(st=>{const b=sb(st);return{x:b.x+b.w/2,y:b.y+b.h/2,w:Math.max(1,strokeLen(st))}}).filter(Boolean);
  if(centers.length<2)return 0;
  let mx=0,my=0,sw=0;centers.forEach(p=>{mx+=p.x*p.w;my+=p.y*p.w;sw+=p.w});mx/=sw;my/=sw;
  let xx=0,xy=0,yy=0;centers.forEach(p=>{let dx=p.x-mx,dy=p.y-my;xx+=p.w*dx*dx;xy+=p.w*dx*dy;yy+=p.w*dy*dy});
  let a=.5*Math.atan2(2*xy,xx-yy);
  while(a>Math.PI/4)a-=Math.PI/2;while(a<-Math.PI/4)a+=Math.PI/2;
  return a
}
function segmentInk(strokes,forcedAngle=null,label=''){
  if(!strokes?.length)return{angle:0,lines:[]};
  const allb=union(strokes.map(sb)),cx=allb.x+allb.w/2,cy=allb.y+allb.h/2;
  const ang=forcedAngle==null?estimateAngle(strokes):forcedAngle;
  const R=rotateStrokes(strokes,-ang,cx,cy);
  const items=R.map((st,i)=>({st,i,b:sb(st),cy:sb(st).y+sb(st).h/2,cx:sb(st).x+sb(st).w/2})).sort((a,b)=>a.cy-b.cy);
  const heights=items.map(x=>Math.max(4,x.b.h)).sort((a,b)=>a-b),mh=heights[Math.floor(heights.length/2)]||20;
  const lines=[];
  items.forEach(it=>{
    let best=null,dist=Infinity;
    lines.forEach(L=>{const d=Math.abs(it.cy-L.cy);if(d<Math.max(mh*.65,L.h*.65)&&d<dist){best=L;dist=d}});
    if(!best){best={items:[],cy:it.cy,h:it.b.h};lines.push(best)}
    best.items.push(it);best.cy=best.items.reduce((a,x)=>a+x.cy,0)/best.items.length;best.h=Math.max(...best.items.map(x=>x.b.h))
  });
  lines.sort((a,b)=>a.cy-b.cy);
  const labelLines=String(label||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const flatWords=canon(label).split(' ').filter(Boolean);let wordCursor=0;
  lines.forEach((L,li)=>{
    L.items.sort((a,b)=>a.b.x-b.b.x);
    const gaps=[];for(let i=1;i<L.items.length;i++){const a=L.items[i-1].b,b=L.items[i].b;gaps.push(b.x-(a.x+a.w))}
    const pos=gaps.filter(x=>x>0).sort((a,b)=>a-b),mg=pos.length?pos[Math.floor(pos.length/2)]:mh*.12,split=Math.max(mh*.42,mg*2.2,9);
    L.words=[];let group=[];
    L.items.forEach((it,i)=>{if(group.length){const gb=union(group.map(z=>z.b)),gap=it.b.x-(gb.x+gb.w);if(gap>split){L.words.push(group);group=[]}}group.push(it)});if(group.length)L.words.push(group);
    const lineText=labelLines[li]||'';
    const tokens=lineText?lineText.split(/\s+/):flatWords.slice(wordCursor,wordCursor+L.words.length);
    L.words=L.words.map((g,wi)=>{
      const rb=union(g.map(x=>x.b)),token=tokens[wi]||flatWords[wordCursor+wi]||'';
      const n=[...token].filter(ch=>/\p{L}|\d/u.test(ch)).length;
      const chars=[];
      if(n){
        const proj=Array(Math.max(1,Math.ceil(rb.w))).fill(0);
        g.forEach(it=>(it.st.pts||[]).forEach(p=>{const k=Math.max(0,Math.min(proj.length-1,Math.floor(p.x-rb.x)));proj[k]++}));
        let cuts=[];for(let k=1;k<proj.length-1;k++)if(proj[k]<=proj[k-1]&&proj[k]<=proj[k+1])cuts.push(k);
        const targets=[];for(let ci=1;ci<n;ci++)targets.push(rb.w*ci/n);
        const chosen=targets.map(t=>cuts.reduce((best,k)=>Math.abs(k-t)<Math.abs(best-t)?k:best,t));
        const xs=[0,...chosen,rb.w];
        for(let ci=0;ci<n;ci++)chars.push({x:rb.x+xs[ci],y:rb.y,w:Math.max(2,xs[ci+1]-xs[ci]),h:rb.h,char:[...token].filter(ch=>/\p{L}|\d/u.test(ch))[ci]||''})
      }
      return{items:g,b:rb,text:token,chars}
    });
    wordCursor+=L.words.length;
    L.b=union(L.words.map(w=>w.b));
  });
  return{angle:ang,cx,cy,rotated:R,lines}
}

function segOverride(id){
  S.segment.overrides=S.segment.overrides||{};
  S.segment.overrides[id]=S.segment.overrides[id]||{merges:[],splits:[],labels:{}};
  return S.segment.overrides[id]
}
function rebuildWordChars(w,text){
  w.text=text||w.text||'';
  const chars=[...w.text].filter(ch=>/\p{L}|\d/u.test(ch)),n=chars.length;
  w.chars=[];
  if(n)for(let i=0;i<n;i++)w.chars.push({x:w.b.x+w.b.w*i/n,y:w.b.y,w:w.b.w/n,h:w.b.h,char:chars[i]});
  return w
}
function applySegOverrides(seg,sampleId){
  const O=segOverride(sampleId);
  // merges are applied from right to left so stored indices remain stable enough
  for(const liStr of [...new Set(O.merges.map(x=>String(x.li)))]){
    const li=+liStr,L=seg.lines[li];if(!L)continue;
    const idxs=O.merges.filter(x=>x.li===li).map(x=>x.wi).sort((a,b)=>b-a);
    idxs.forEach(wi=>{
      if(!L.words[wi]||!L.words[wi+1])return;
      const a=L.words[wi],b=L.words[wi+1],nw={items:[...(a.items||[]),...(b.items||[])],b:union([a.b,b.b]),text:[a.text,b.text].filter(Boolean).join(' ')};
      rebuildWordChars(nw,nw.text);L.words.splice(wi,2,nw)
    });
  }
  // splits cut the selected region at a saved fractional x location
  O.splits.slice().sort((a,b)=>a.li-b.li||a.wi-b.wi).forEach(sp=>{
    const L=seg.lines[sp.li],w=L?.words?.[sp.wi];if(!w)return;
    const cut=w.b.x+w.b.w*Math.max(.15,Math.min(.85,sp.frac||.5));
    const leftItems=(w.items||[]).filter(it=>it.cx<=cut),rightItems=(w.items||[]).filter(it=>it.cx>cut);
    const lb=leftItems.length?union(leftItems.map(x=>x.b)):{x:w.b.x,y:w.b.y,w:cut-w.b.x,h:w.b.h};
    const rb=rightItems.length?union(rightItems.map(x=>x.b)):{x:cut,y:w.b.y,w:w.b.x+w.b.w-cut,h:w.b.h};
    const toks=String(w.text||'').split(/\s+/).filter(Boolean);
    const a={items:leftItems,b:lb,text:toks[0]||''},b={items:rightItems,b:rb,text:toks.slice(1).join(' ')||''};
    rebuildWordChars(a,a.text);rebuildWordChars(b,b.text);L.words.splice(sp.wi,1,a,b)
  });
  seg.lines.forEach((L,li)=>L.words.forEach((w,wi)=>{
    const k=li+':'+wi;if(O.labels[k]!=null)rebuildWordChars(w,O.labels[k]);
  }));
  return seg
}
function currentSeg(){
  const s=samples().find(x=>x.id===S.segment.sampleId);if(!s)return null;
  const st=realStrokesFromSample(s),auto=estimateAngle(st),ang=S.segment.angle==null?auto:S.segment.angle*Math.PI/180;
  return {s,st,auto,ang,seg:applySegOverrides(segmentInk(st,ang,s.label),s.id)}
}

function realStrokesFromSample(s){

  c.forEach(st=>{const pts=(st.pts||[]).map(q=>({x:q[0]*500,y:q[1]*500,p:q[2]??.5}));if(pts.length>1)out.push({id:uid('tmp'),pts,b:boundsPts(pts)})});return out

/* ---------- canvas ---------- */
function drawStroke(ctx,st,transform=null,color='#12171c',width=2.2){
  const p=st.pts||[];if(p.length<2)return;ctx.save();ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=width;ctx.beginPath();
  p.forEach((q,i)=>{let x=q.x,y=q.y;if(transform){const z=transform(q);x=z.x;y=z.y}i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.restore()
}
function worldPoint(e,c){
  const r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height;
  const vx=(e.clientX-r.left)*sx,vy=(e.clientY-r.top)*sy;
  return{x:(vx-S.canvas.panX)/S.canvas.zoom,y:(vy-S.canvas.panY)/S.canvas.zoom,p:e.pressure>0?e.pressure:.5}
}
function initInkCanvas(id='ink-canvas'){
  const c=document.getElementById(id);if(!c||c._init)return;c._init=true;
  const state=id==='test-canvas'?S.test:S.canvas;
  const point=(e)=>{const r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height;return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy,p:e.pressure>0?e.pressure:.5}};
  let panStart=null;
  c.addEventListener('pointerdown',e=>{
    if(e.cancelable)e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}
    if(id!=='test-canvas' && (S.canvas.tool==='pan'||(e.pointerType==='touch'&&!S.canvas.fingerDraw))){panStart={x:e.clientX,y:e.clientY,px:S.canvas.panX,py:S.canvas.panY};return}
    const p=id==='test-canvas'?point(e):worldPoint(e,c);
    state.active={id:uid('st'),pointerId:e.pointerId,pts:[p],b:null};paintCanvas(id)
  });
  c.addEventListener('pointermove',e=>{
    if(e.cancelable)e.preventDefault();
    if(panStart&&id!=='test-canvas'){S.canvas.panX=panStart.px+(e.clientX-panStart.x)*(c.width/c.getBoundingClientRect().width);S.canvas.panY=panStart.py+(e.clientY-panStart.y)*(c.height/c.getBoundingClientRect().height);paintCanvas(id);return}
    if(!state.active||state.active.pointerId!==e.pointerId)return;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    evs.forEach(q=>{const p=id==='test-canvas'?point(q):worldPoint(q,c),a=state.active.pts.at(-1);if(!a||Math.hypot(p.x-a.x,p.y-a.y)>.5)state.active.pts.push(p)});paintCanvas(id)
  });
  const up=e=>{if(panStart){panStart=null;saveLocal();return}if(!state.active||state.active.pointerId!==e.pointerId)return;const st=state.active;state.active=null;if(st.pts.length>1){st.b=boundsPts(st.pts);state.strokes.push(st)}paintCanvas(id)};
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  if(id!=='test-canvas')c.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const z=S.canvas.zoom*(e.deltaY<0?1.1:.9);S.canvas.zoom=Math.max(.3,Math.min(4,z));paintCanvas(id)}else{S.canvas.panX-=e.deltaX;S.canvas.panY-=e.deltaY;paintCanvas(id)}},{passive:false});
  paintCanvas(id)
}
function paintCanvas(id='ink-canvas',seg=null){
  const c=document.getElementById(id);if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#edf0f3';for(let xx=20;xx<c.width;xx+=20)for(let yy=20;yy<c.height;yy+=20)x.fillRect(xx,yy,1,1);
  const state=id==='test-canvas'?S.test:S.canvas,all=state.active?[...state.strokes,state.active]:state.strokes;
  if(id==='test-canvas')all.forEach(st=>drawStroke(x,st));
  else{
    const tf=p=>({x:p.x*S.canvas.zoom+S.canvas.panX,y:p.y*S.canvas.zoom+S.canvas.panY});
    all.forEach(st=>drawStroke(x,st,tf));
  }
  if(seg)drawSegOverlay(x,seg)
}
function drawSegOverlay(x,seg){
  x.save();x.lineWidth=1.4;x.font='12px -apple-system,system-ui';
  seg.lines.forEach((L,li)=>{
    x.strokeStyle='#4f46e5';x.setLineDash([5,4]);x.strokeRect(L.b.x,L.b.y,L.b.w,L.b.h);x.setLineDash([]);x.fillStyle='#4f46e5';x.fillText(`line ${li+1}`,L.b.x,L.b.y-4);
    L.words.forEach((w,wi)=>{x.strokeStyle=wi===S.segment.selectedWord?'#b91c1c':'#15803d';x.strokeRect(w.b.x,w.b.y,w.b.w,w.b.h);x.fillStyle='#15803d';x.fillText(w.text||`word ${wi+1}`,w.b.x,w.b.y+12);w.chars.forEach(ch=>{x.strokeStyle='rgba(180,83,9,.65)';x.strokeRect(ch.x,ch.y,ch.w,ch.h);if(ch.char){x.fillStyle='#b45309';x.fillText(ch.char,ch.x+2,ch.y+ch.h-3)}})})

}

/* ---------- guided collection ---------- */
const SETS=[
 ['lower','Lowercase alphabet'],['upper','Uppercase alphabet'],['digits','Digits 0–9'],
 ['terms','Terms from loaded MedGraph'],['symbols','MedGraph symbols'],['shapes','Circles + arrows'],['custom','Custom phrase']
];
function guidedItems(set,custom=''){
  if(set==='lower')return[...'abcdefghijklmnopqrstuvwxyz'].map(x=>({category:'letter',label:x,prompt:`Write lowercase “${x}”`}));
  if(set==='upper')return[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(x=>({category:'letter',label:x,prompt:`Write uppercase “${x}”`}));
  if(set==='digits')return[...'0123456789'].map(x=>({category:'letter',label:x,prompt:`Write digit “${x}”`}));
  if(set==='terms'){let a=vocab().slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,40).map(x=>({category:'word',label:x,prompt:`Write the term:\\n${x}`}))}
  if(set==='symbols')return[
    {category:'definition',label:'::',prompt:'Write  ::'},
    {category:'class',label:'[drug]',prompt:'Write  [drug]'},
    {category:'class',label:'[disease]',prompt:'Write  [disease]'},
    {category:'class',label:'[bacterium]',prompt:'Write  [bacterium]'},
    {category:'class',label:'[virus]',prompt:'Write  [virus]'},
    {category:'sequence_step',label:'1.',prompt:'Write  1.'},{category:'sequence_step',label:'2.',prompt:'Write  2.'},{category:'sequence_step',label:'3.',prompt:'Write  3.'},
    {category:'relationship_label',label:'inhibits',prompt:'Write “inhibits”'},{category:'relationship_label',label:'activates',prompt:'Write “activates”'}
  ];
  if(set==='shapes')return[
    {category:'node_enclosure',label:'circle',prompt:'Draw a circle around an imaginary node'},
    {category:'node_enclosure',label:'box',prompt:'Draw a box around an imaginary node'},
    ...['right','left','up','down','diag up-right','diag down-left'].map(d=>({category:'relationship_arrow',label:'relationship arrow',prompt:`Draw a RELATIONSHIP arrow pointing ${d}`})),
    ...['right','down','diag down-right'].map(d=>({category:'sequence_arrow',label:'sequence arrow',prompt:`Draw a SEQUENCE / PROCEDURE arrow pointing ${d}`}))
  ];
  if(set==='custom'&&custom.trim())return[{category:'word',label:custom.trim().replace(/\n+/g,' '),prompt:`Write this phrase exactly:\\n${custom.trim()}`}];

}

/* ---------- derive letters/context from word samples ---------- */
function strokesInRect(strokes,r){
  const out=[];strokes.forEach(st=>{const pts=(st.pts||[]).filter(p=>p.x>=r.x-2&&p.x<=r.x+r.w+2&&p.y>=r.y-3&&p.y<=r.y+r.h+3);if(pts.length>1)out.push({id:uid('seg'),pts,b:boundsPts(pts)})});return out
}
function deriveLetters(parent,strokes,label){
  const seg=segmentInk(strokes,null,label),chars=[...String(label)].filter(ch=>/\p{L}|\d/u.test(ch));if(chars.length<2)return;
  let idx=0;seg.lines.forEach(L=>L.words.forEach(w=>w.chars.forEach(ch=>{
    const part=strokesInRect(seg.rotated,w.chars[w.chars.indexOf(ch)]||ch); // rotated-frame part
    if(part.length&&ch.char){
      const prev=chars[idx-1]||'',next=chars[idx+1]||'';
      const a=storeSample('letter_auto',ch.char,part,{autoLetter:true,parentId:parent.id,prev,next,weight:.55},'word-segmentation');a.meta.weight=.55
    }idx++
  })))
}

/* ---------- recognizer ---------- */
function editDistance(a,b){a=canon(a);b=canon(b);const n=b.length,d=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=n;j++){const old=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return d[n]}
function prototypeGuess(strokes,filter='text',allowSynthetic=true){
  const sig=signature(strokes),arr=[];
  samples().forEach(s=>{
    if(!allowSynthetic&&s.source==='synthetic')return;
    if(filter==='letter'&&!['letter','letter_auto'].includes(s.category))return;
    if(filter==='text'&&!['word','node','relationship_label','definition','class','sequence_step'].includes(s.category))return;
    if(!s.sig?.length||!s.label)return;
    const sc=sigSim(sig,s.sig)*sampleWeight(s);if(sc>.12)arr.push({label:s.label,score:sc,source:s.source})
  });
  arr.sort((a,b)=>b.score-a.score);const seen=new Set();return arr.filter(x=>{const k=canon(x.label);if(seen.has(k))return false;seen.add(k);return true}).slice(0,8)
}
function letterGuess(strokes,allowSynthetic=true){
  return prototypeGuess(strokes,'letter',allowSynthetic).slice(0,4)
}
function recognizeWord(strokes,allowSynthetic=true){
  const direct=prototypeGuess(strokes,'text',allowSynthetic);
  const seg=segmentInk(strokes),parts=[];
  seg.lines.forEach(L=>L.words.forEach(w=>{
    const chars=[];
    const est=Math.max(1,Math.round(w.b.w/Math.max(10,w.b.h*.55)));
    for(let i=0;i<est;i++){
      const r={x:w.b.x+w.b.w*i/est,y:w.b.y,w:w.b.w/est,h:w.b.h},ink=strokesInRect(seg.rotated,r),g=letterGuess(ink,allowSynthetic)[0];if(g)chars.push(g.label)
    }
    if(chars.length)parts.push(chars.join(''))
  }));
  const composed=parts.join(' ');
  const out=[...direct];
  if(composed.length>1)out.push({label:composed,score:.38,source:'letters'});
  const V=vocab();
  [composed,...direct.slice(0,5).map(x=>x.label)].filter(Boolean).forEach(raw=>{
    V.forEach(v=>{const d=editDistance(raw,v),den=Math.max(canon(raw).length,canon(v).length,1),sc=1-d/den;if(sc>.45)out.push({label:v,score:.45+sc*.5,source:'MedGraph vocabulary'})})
  });
  out.sort((a,b)=>b.score-a.score);const seen=new Set();return out.filter(x=>{const k=canon(x.label);if(seen.has(k))return false;seen.add(k);return true}).slice(0,8)
}

/* ---------- generator ---------- */
function charPool(ch,prev='',next=''){
  let a=samples().filter(s=>['letter','letter_auto'].includes(s.category)&&String(s.label).toLowerCase()===String(ch).toLowerCase());
  a.sort((x,y)=>{
    const cx=(x.meta?.prev===prev?2:0)+(x.meta?.next===next?2:0)+(x.category==='letter'?1:0)+(x.source!=='synthetic'?3:0);
    const cy=(y.meta?.prev===prev?2:0)+(y.meta?.next===next?2:0)+(y.category==='letter'?1:0)+(y.source!=='synthetic'?3:0);
    return cy-cx
  });return a
}
function generateText(text,settings=S.gen){
  const strokes=[];let x=20,y=35,lineH=82,coverage=0,needed=0,autoUsed=0;
  const slant=(Math.random()*2-1)*(settings.slant||0)*Math.PI/180;
  const sizeBase=62*(1+(Math.random()*2-1)*(settings.size||0)/100);
  const chars=[...text];
  for(let i=0;i<chars.length;i++){
    const ch=chars[i],prev=chars[i-1]||'',next=chars[i+1]||'';
    if(ch==='\n'){x=20;y+=lineH;continue}
    if(/\s/.test(ch)){x+=sizeBase*.42*(1+(Math.random()*2-1)*(settings.spacing||0)/100);continue}
    needed++;
    const pool=charPool(ch,prev,next);
    if(!pool.length){x+=sizeBase*.55;continue}
    coverage++;const s=pool[Math.floor(Math.random()*Math.min(pool.length,Math.max(1,Math.ceil(pool.length*.65))))];if(s.category==='letter_auto')autoUsed++;
    const sc=sizeBase*(.78+Math.random()*.16),rot=slant+(Math.random()*2-1)*.035,j=(settings.jitter||0);
    const letter=denormalize(s.strokes,x,y,sc,rot,1,1,j);
    strokes.push(...letter);
    const b=union(letter.map(sb)),advance=Math.max(sc*.38,b.w)+sc*.12*(1+(Math.random()*2-1)*(settings.spacing||0)/100);x+=advance;
    if(x>900){x=20;y+=lineH}
  }
  const distortion=Math.min(1,Math.abs(settings.slant||0)/20+(settings.size||0)/45+(settings.spacing||0)/45+(settings.jitter||0)/7);
  const quality=Math.max(0,Math.min(1,(needed?coverage/needed:0)*.75+(1-distortion)*.25-(autoUsed/Math.max(1,coverage))*.08));
  return{strokes,quality,coverage:needed?coverage/needed:0,autoUsed,needed}
}
function makePreviews(){
  const text=(document.getElementById('gen-text').value||'').trim();if(!text)return toast('Enter text to generate');
  Object.assign(S.gen,{

    spacing:+document.getElementById('gen-spacing').value||0,jitter:+document.getElementById('gen-jitter').value||0
  });
  S.gen.previews=Array.from({length:S.gen.count},()=>generateText(text,S.gen));saveLocal();render()
}
function acceptSynthetic(i){

function acceptAllGood(){

  S.gen.previews=[];saveLocal();render();toast(`${n} high-quality synthetic examples added`)

function augmentSample(id){
  const s=samples().find(x=>x.id===id);if(!s)return;const n=+document.getElementById('aug-n')?.value||10;
  for(let k=0;k<n;k++){
    const base=sampleAsStrokes(s),b=union(base.map(sb)),cx=b.x+b.w/2,cy=b.y+b.h/2,rot=(Math.random()*2-1)*8*Math.PI/180,scale=.88+Math.random()*.24;
    const cs=Math.cos(rot),sn=Math.sin(rot),out=base.map(st=>{const pts=st.pts.map(p=>{let dx=(p.x-cx)*scale,dy=(p.y-cy)*scale;return{x:cx+dx*cs-dy*sn+(Math.random()*2-1)*1.3,y:cy+dx*sn+dy*cs+(Math.random()*2-1)*1.3,p:p.p}});return{id:uid('aug'),pts,b:boundsPts(pts)}});
    const sm=storeSample(s.category,s.label,out,{synthetic:true,augmentedFrom:s.id,quality:.82,weight:.25},'synthetic');sm.meta.weight=.25
  }saveLocal();render();toast(`${n} augmentations added`)
}
function paintPreview(id,p){
  const c=document.getElementById(id);if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  if(!p?.strokes?.length){x.fillStyle='#b91c1c';x.fillText('Not enough trained letters to generate this text.',10,20);return}
  const b=union(p.strokes.map(sb)),sc=Math.min((c.width-20)/Math.max(1,b.w),(c.height-20)/Math.max(1,b.h));
  p.strokes.forEach(st=>drawStroke(x,st,q=>({x:10+(q.x-b.x)*sc,y:10+(q.y-b.y)*sc}),'#12171c',1.8))
}

/* ---------- validation ---------- */
function addValidationFromCanvas(){
  const truth=(document.getElementById('test-truth')?.value||'').trim();if(!truth||!S.test.strokes.length)return toast('Write a validation phrase and enter its true text');
  S.validation.push({id:uid('val'),label:truth,strokes:normalizeStrokes(S.test.strokes),created:Date.now()});S.test.strokes=[];saveLocal();render();toast('Held-out validation example saved')
}
function valStrokes(v){return denormalize(v.strokes,0,0,500)}
function evaluate(allowSynthetic){
  if(!S.validation.length)return null;let right=0,rows=[];
  S.validation.forEach(v=>{const g=recognizeWord(valStrokes(v),allowSynthetic),top=g[0]?.label||'';const ok=canon(top)===canon(v.label);if(ok)right++;rows.push({truth:v.label,guess:top,ok})});
  return{acc:right/S.validation.length,rows}
}
function runTest(){
  if(!S.test.strokes.length)return toast('Write something in the test pad');
  const g=recognizeWord(S.test.strokes,true);S.test.result={guesses:g,seg:segmentInk(S.test.strokes)};render()
}
function clearTest(){S.test.strokes=[];S.test.result=null;render()}

/* ---------- recommendations/coverage ---------- */
function coverage(){
  const real=samples().filter(s=>s.source!=='synthetic'&&s.category==='letter'),auto=samples().filter(s=>s.category==='letter_auto'),syn=samples().filter(s=>s.source==='synthetic');
  const chars='abcdefghijklmnopqrstuvwxyz'.split('').map(ch=>{
    const r=real.filter(s=>s.label.toLowerCase()===ch).length,a=auto.filter(s=>s.label.toLowerCase()===ch).length;
    return{ch,r,a,score:r+a*.35}
  });return{chars,real:real.length,auto:auto.length,syn:syn.length}
}
function recs(){
  const C=coverage(),out=[];
  C.chars.filter(x=>x.score<5).sort((a,b)=>a.score-b.score).slice(0,8).forEach(x=>out.push(`Write more lowercase “${x.ch}” — ${x.r} direct + ${x.a} inferred`));
  const rel=samples().filter(s=>s.category==='relationship_arrow'&&s.source!=='synthetic').length,seq=samples().filter(s=>s.category==='sequence_arrow'&&s.source!=='synthetic').length;
  if(rel<30)out.push(`Relationship arrows need more variety — ${rel}/30 useful baseline`);
  if(seq<20)out.push(`Sequence arrows need more variety — ${seq}/20 useful baseline`);
  const words=samples().filter(s=>['word','node'].includes(s.category)&&s.source!=='synthetic').length;if(words<25)out.push(`Add more real words/terms — ${words}/25 useful baseline`);
  if(!S.validation.length)out.push('Add 5–10 held-out validation phrases so improvement can be measured');
  return out.slice(0,10)
}

function paintSegmentLive(){
  const C=currentSeg();if(!C)return;const c=document.getElementById('seg-canvas');if(!c)return;
  const R=rotateStrokes(C.st,-C.ang,C.seg.cx,C.seg.cy),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  const b=union(R.map(sb)),sc=Math.min((c.width-40)/Math.max(1,b.w),(c.height-40)/Math.max(1,b.h)),tf=q=>({x:20+(q.x-b.x)*sc,y:20+(q.y-b.y)*sc});
  R.forEach(st=>drawStroke(x,st,tf,'#12171c',1.9));
  const seg2=JSON.parse(JSON.stringify(C.seg));seg2.lines.forEach((L,li)=>{L.b={x:20+(L.b.x-b.x)*sc,y:20+(L.b.y-b.y)*sc,w:L.b.w*sc,h:L.b.h*sc};L.words.forEach((w,wi)=>{w.b={x:20+(w.b.x-b.x)*sc,y:20+(w.b.y-b.y)*sc,w:w.b.w*sc,h:w.b.h*sc};w.chars.forEach(ch=>{ch.x=20+(ch.x-b.x)*sc;ch.y=20+(ch.y-b.y)*sc;ch.w*=sc;ch.h*=sc})})});
  const old=S.segment.selectedWord;S.segment.selectedWord=+String(S.segment.selectedWordKey||'0:0').split(':')[1];drawSegOverlay(x,seg2);S.segment.selectedWord=old
}
function rederiveSelected(){
  const C=currentSeg();if(!C)return;
  const before=samples().length;
  // Remove prior inferred letters for this parent so corrections replace, not duplicate, them.
  for(let i=samples().length-1;i>=0;i--)if(samples()[i].category==='letter_auto'&&samples()[i].meta?.parentId===C.s.id)samples().splice(i,1);
  const chars=[...C.s.label].filter(ch=>/\p{L}|\d/u.test(ch));let idx=0;
  C.seg.lines.forEach(L=>L.words.forEach(w=>w.chars.forEach(ch=>{
    const part=strokesInRect(C.seg.rotated,ch);
    if(part.length&&ch.char){
      const a=storeSample('letter_auto',ch.char,part,{autoLetter:true,parentId:C.s.id,prev:chars[idx-1]||'',next:chars[idx+1]||'',weight:.55,segmentationCorrected:true},'word-segmentation');
      a.meta.weight=.55;
    }idx++
  })));
  saveLocal();render();toast(`${samples().length-before} net inferred letter samples after correction`)
}
