<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedGraph — type it, it files itself</title>
<style>
:root{
  --bg:#E9ECEF;--surface:#FFF;--surface2:#F4F6F8;--ink:#12171C;--muted:#5C6873;
  --line:#D3D9DF;--line2:#E4E9ED;--stub:#9A3412;--ok:#15803D;--warn:#B45309;--err:#B91C1C;--r:3px;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.eyebrow{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 2px rgba(18,23,28,.08)}
textarea{resize:vertical}
header{background:var(--ink);color:#fff;padding:0 18px;display:flex;align-items:center;gap:18px;height:54px;position:sticky;top:0;z-index:40}
.brand{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-size:9px;letter-spacing:.16em;opacity:.55;font-weight:600}
.hbtns{display:flex;gap:7px;flex-wrap:wrap}
.nbtn{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;padding:6px 11px;border-radius:var(--r);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:.13s}
.nbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.6)}
.nbtn.solid{background:#fff;color:var(--ink);border-color:#fff}
.nbtn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.hstats{display:flex;gap:16px;margin-left:auto;align-items:center}
.hstat{text-align:right;line-height:1.15}
.hstat b{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:15px;font-weight:500;display:block}
.hstat span{font-size:9px;letter-spacing:.13em;text-transform:uppercase;opacity:.5;font-weight:600}
.app{display:grid;grid-template-columns:270px 1fr;height:calc(100% - 54px)}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side-h{padding:12px 14px 10px;border-bottom:1px solid var(--line2);display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:3px 9px;font-size:11.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.stubc.on{background:var(--stub);border-color:var(--stub)}
.nodelist{overflow-y:auto;flex:1;padding:6px 0 40px}
.nrow{padding:7px 14px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;align-items:baseline;gap:8px}
.nrow:hover{background:var(--surface2)}
.nrow.sel{background:#12171C;color:#fff}
.nterm{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:13px;font-weight:500;flex:1;word-break:break-word}
.deg{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:10.5px;opacity:.7}
.stubtag{color:var(--stub);font-weight:700;font-size:9.5px;letter-spacing:.1em}
.nrow.sel .stubtag{color:#FDBA74}
main{overflow-y:auto;padding:20px 24px 90px}
.wrap{max-width:900px}
.empty{color:var(--muted);padding:36px 0;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.panel-h{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.panel-h h2{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:19px;letter-spacing:.02em;text-transform:uppercase;font-weight:700}
.fld{margin-bottom:12px}.fld>label{display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);flex-wrap:wrap;align-items:center}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:8px 16px;border-radius:var(--r);font-weight:600}
.btn:hover{background:#000}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--err);border-color:#F0C0C0}
.mini{padding:4px 9px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);color:var(--muted)}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.mini.x{color:var(--err);border-color:#F0C0C0}
.mini.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- compose ---------- */
.compose{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.classkeys{display:none;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 2px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.classkeys.show{display:flex}.classkeys .cklabel{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.classkeys button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font:600 11px/1.1 IBM Plex Mono,monospace;color:var(--ink);cursor:pointer}
.classkeys button:hover{border-color:var(--ink)}

#edwrap{position:relative}
#hl,#src{
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:13.5px;line-height:1.72;min-height:340px;
  tab-size:2;padding:12px 13px;
  white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;
  border:1px solid var(--line);border-radius:var(--r);
  box-sizing:border-box;margin:0;
}
/* the layer sits behind and shows the colours; the textarea on top holds a
   transparent glyph so the caret and selection stay native */
#hl{
  position:absolute;inset:0;background:#FCFDFE;color:#12171C;
  overflow:hidden;pointer-events:none;z-index:0;
  scrollbar-gutter:stable;          /* same reserved gutter as the textarea, so */
}                                   /* both layers wrap at the same column */
#src{
  position:relative;z-index:1;background:transparent;color:transparent;
  caret-color:#12171C;resize:vertical;width:100%;
  scrollbar-gutter:stable;
}
#src::selection{background:rgba(60,110,160,.22)}
.hl-cm{color:#9AA6B2;font-style:italic}
.hl-hd{color:#0F766E;font-weight:600}
.hl-tag{color:#A21CAF}
.hl-op{color:#12171C;font-weight:700}
.hl-term{background:rgba(60,110,160,.13);border-radius:2px}
.hl-new{border-bottom:1px dotted #C7A46B}
.hl-verb{font-weight:600}
.hl-state{font-weight:600;border-bottom:2px solid currentColor}
.hl-cls{color:#B45309;font-weight:600}
.hl-brk{background:rgba(15,118,110,.13);border-radius:2px}
.hl-neg{color:#B91C1C;font-weight:700}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;padding:26px 18px;
  border:1px solid var(--line);border-radius:var(--r);background:#FAFBFC;line-height:2.4}
.chain .chip{font-size:13px}
.chain .chip.past{opacity:.55}
.chain .chip.here{background:#12171C;color:#fff;border-color:#12171C;font-weight:600}
.chain .chip.fresh{border-color:var(--ok);background:#F4FBF6;font-weight:600}
.chain .chip.unknown{border-style:dashed;color:var(--muted);min-width:52px;text-align:center}
.charr{display:inline-flex;align-items:center;gap:3px;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:10.5px;margin:0 2px}
.charr.past{opacity:.45}
.charr.pending{opacity:.9}
.charr.unknown{color:var(--muted)}
.charr .cline{width:12px;height:2px;background:currentColor;border-radius:1px}
.charr.unknown .cline{background:none;border-top:2px dotted currentColor;height:0}
.charr .crel{white-space:nowrap}
.charr .chead{font-size:13px;line-height:1}
.hllegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.hllegend b{font-weight:600}
.gutter{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:5px;flex-wrap:wrap}
.legend code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:100px;padding:2px 8px;color:var(--muted);cursor:help}
.pv{display:grid;gap:10px}
.pv .count{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.pv .count b{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:19px;font-weight:500}
.pv .count span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.issue{border-left:3px solid var(--warn);background:#FFFBF3;border:1px solid #EBD3A8;border-radius:var(--r);padding:8px 11px;font-size:12.5px}
.issue.bad{border-left-color:var(--err);background:#FEF4F4;border-color:#EBC0C0}
.issue .ln{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-weight:600;font-size:11px;color:var(--muted)}

/* ---------- triple diagram ---------- */
.triple{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px;overflow:hidden}
.triple.pending{border-style:dashed;background:#FCFDFE}
.fambar{height:4px;background:var(--muted)}
.triple .row{display:flex;align-items:center;padding:11px 13px;flex-wrap:wrap;gap:2px}
.node{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:13px;font-weight:500;border:1px solid var(--ink);border-radius:var(--r);padding:3px 9px;background:#fff;cursor:pointer}
.node:hover{background:var(--ink);color:#fff}
.node.isstub{border-color:var(--stub);border-style:dashed;color:var(--stub)}
.node.willmake{border-color:var(--ok);border-style:dashed;color:var(--ok);cursor:default}
.node.willmake:hover{background:#fff;color:var(--ok)}
.arrow{display:flex;flex-direction:column;align-items:center;padding:0 6px;min-width:100px}
.arrow .rel{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:10.5px;font-weight:600;white-space:nowrap;margin-bottom:2px}
.arrow .line{height:0;border-top:1.5px solid currentColor;width:100%;position:relative}
.arrow .line:after{content:"";position:absolute;right:-1px;top:-4px;border:4px solid transparent;border-left-color:currentColor}
.arrow.sym .line:before{content:"";position:absolute;left:-1px;top:-4px;border:4px solid transparent;border-right-color:currentColor}
.yields{display:flex;align-items:center;gap:8px;padding:0 13px 11px;margin-top:-3px;flex-wrap:wrap}
.yl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gates{border-top:1px dashed var(--line);background:var(--surface2);padding:8px 13px;display:grid;gap:6px}
.gate{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gtype{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;border-radius:100px;padding:1px 7px}
.g-unless{color:#B91C1C}.g-only_if{color:#0369A1}.g-requires_cofactor{color:#B45309}
.g-dose_dependent{color:#6B46C1}.g-context_dependent{color:#6B46C1}.g-possible{color:#B45309}.g-potentiated_by{color:#15803D}
.arrow.neg .line{border-top-style:dashed}
.arrow.neg .rel{text-decoration:line-through}
#mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:#FAFBFC;overflow:hidden}
#mapcv{display:block;width:100%;height:620px;cursor:grab}
#mapcv.grabbing{cursor:grabbing}
.mapbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.mapbar select,.mapbar input{width:auto;min-width:112px;padding:5px 8px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.legend2{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;gap:3px;max-width:210px;backdrop-filter:blur(3px)}
.legend2 div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend2 i{width:14px;height:0;border-top:2px solid;flex:none}
.mapinfo{position:absolute;right:10px;top:10px;width:250px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;backdrop-filter:blur(3px)}
.mapinfo h4{margin:0 0 3px;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-weight:500;font-size:14px}
.mapinfo .sub{font-size:11px;color:var(--muted);font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.mapinfo ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px;max-height:190px;overflow-y:auto}
.mapinfo li{font-size:11.5px;color:var(--muted);display:flex;gap:5px;align-items:baseline}
.mapinfo li b{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-weight:500;font-size:10.5px;flex:none}
.maphint{position:absolute;left:10px;top:10px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.9);border-radius:100px;padding:3px 10px}
.clsbadge{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;border-radius:100px;padding:2px 8px;vertical-align:2px}
.slots{display:grid;gap:0;margin:10px 0 2px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slotrow{display:grid;grid-template-columns:132px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line2);background:#fff}
.slotrow:last-child{border-bottom:0}
.slotrow.empty{background:var(--surface2)}
.slotk{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.slotrel{font-size:10px;color:var(--muted);opacity:.75}
.slotadd{border:1px dashed var(--line);background:transparent;border-radius:100px;padding:2px 10px;font-size:11.5px;color:var(--muted)}
.slotadd:hover{border-color:var(--ink);color:var(--ink)}
.acbox{position:fixed;z-index:200;background:#fff;border:1px solid var(--ink);border-radius:var(--r);
  box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:232px;overflow-y:auto;min-width:230px;max-width:380px;display:none}
.acitem{padding:6px 10px;display:flex;gap:8px;align-items:baseline;cursor:pointer;border-bottom:1px solid var(--line2)}
.acitem:last-child{border-bottom:0}
.acitem.on{background:var(--ink);color:#fff}
.acitem .t{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px;flex:1;word-break:break-word}
.acitem .k{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;flex:none}
.acitem .d{font-size:10.5px;opacity:.6;flex:none}
.acfoot{padding:4px 10px;font-size:10px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface2);position:sticky;bottom:0}
.addverb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.addverb select{width:auto;max-width:190px;padding:3px 6px;font-size:12px}
.qbwrap{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.defcol{display:grid;gap:8px;position:sticky;top:70px}
.defcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:9px 11px}
.defcard.right{border-color:var(--ok);background:#F4FBF6}
.defcard.wrong{border-color:#E5B4B4;background:#FEF6F6}
.defcard h5{margin:0 0 3px;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-weight:500;font-size:12.5px;cursor:pointer}
.defcard h5:hover{text-decoration:underline}
.defcard p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.45}
.defcard .meta{font-size:10px;color:var(--muted);opacity:.8;margin-top:3px}
@media (max-width:900px){.qbwrap{grid-template-columns:1fr}.defcol{position:static}}
.selbar{display:none;align-items:center;gap:7px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:var(--r);padding:6px 9px;margin-bottom:7px}
.selbar .q{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12px;background:rgba(255,255,255,.14);border-radius:3px;padding:2px 7px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar .lbl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.selbar button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:100px;padding:3px 11px;font-size:12px;font-weight:600}
.selbar button:hover{background:rgba(255,255,255,.15);border-color:#fff}
.selbar button.x{border:0;opacity:.5;padding:3px 6px}
.featbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:var(--r);padding:7px 11px;margin:10px 0 0;position:sticky;bottom:10px;z-index:20}
.featbar .q{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12px;background:rgba(255,255,255,.14);border-radius:3px;padding:2px 7px}
.featbar button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:100px;padding:3px 11px;font-size:12px;font-weight:600}
.featbar button:hover{background:rgba(255,255,255,.15);border-color:#fff}
.feat[data-fi]{cursor:text}
.bound{border-top:1px dashed var(--line);background:#FBFCFD;padding:7px 13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bound .lbl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bound button{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:11.5px;font-weight:500;border:1px solid var(--line);background:#fff;border-radius:100px;padding:2px 9px;color:var(--muted)}
.bound button:hover{border-color:var(--ink);color:var(--ink)}
.negpill{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;color:#fff;background:#B91C1C;border-radius:100px;padding:1px 7px;margin:0 4px}
.triple.negated{box-shadow:inset 3px 0 0 #B91C1C}
.gnote{font-size:12px;color:var(--muted)}
.ctx{padding:0 13px 10px;font-size:12.5px;color:var(--muted)}
.tmeta{padding:0 13px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:100px;padding:2px 9px;color:var(--muted)}


/* ---------- whiteboard ---------- */
.wbtools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.wbtools .seg button{padding:6px 10px}
.wbtools select{width:auto;min-width:140px;padding:6px 8px;font-size:12.5px}
.wbscroll{position:relative;overflow:auto;height:min(68vh,720px);min-height:430px;border:1px solid var(--line);border-radius:var(--r);background:#F9FAFB;overscroll-behavior:contain}
#wb-canvas{display:block;width:1600px;height:1000px;background:#fff;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
.wbtools button{touch-action:manipulation}
.wbstatus{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 0;color:var(--muted);font-size:11.5px}
.wbstatus b{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-weight:500;color:var(--ink)}
.wbedit{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:10px 11px;margin:10px 0 0}

<script>
/* ==================== CONSTANTS ==================== */
const FAMILIES=[
 {key:'causal',label:'Causal / mechanistic',color:'#C2255C',rels:['causes','affects','damages','facilitates','provides','determines','repairs','maintains','misses','produces','cleaves','modifies','inhibits','activates','induces','triggers','prevents','stimulates','suppresses','required_for']},
 {key:'structural',label:'Structural / compositional',color:'#2B6CB0',rels:['is_part_of','composed_of','of','located_in','contains','crosses','transports','derived_from','deficient_in','acquires']},
 {key:'taxonomic',label:'Taxonomic / classification',color:'#6B46C1',rels:['is_a','subtype_of','member_of','classified_by']},
 {key:'property',label:'Property / attribute',color:'#0F766E',rels:['has_property','has_state','has_manner']},
 {key:'interactional',label:'Interactional / binding',color:'#B45309',rels:['binds_to','has_affinity_for','receptor_for','ligand_for','substrate_of','cofactor_for','metabolizes','uses','signals','dissociates_from','targets','interacts_with']},
 {key:'regulatory',label:'Regulatory / quantitative',color:'#15803D',rels:['increases','decreases','upregulates','downregulates','depolarizes','polarizes']},
 {key:'associative',label:'Clinical / associative',color:'#64748B',rels:['associated_with','presents_with','has_prodrome','indicates','seen_in','transmitted_by','predisposes_to','infects','discovered']},
 {key:'therapeutic',label:'Therapeutic',color:'#0369A1',rels:['treated_by','contraindicated_in','used_for','sensitive_to','resistant_to','potentiates','antagonizes']},
 {key:'spatial',label:'Spatial / anatomical',color:'#0E7490',rels:['lateral_to','medial_to','superior_to','inferior_to','anterior_to','posterior_to','proximal_to','distal_to','superficial_to','deep_to','inside_of','outside_of','survives_in','escapes','surrounds','adjacent_to','left_of','right_of','drains_into','supplies','innervates']},
 {key:'comparative',label:'Comparative',color:'#A21CAF',rels:['similar_to','appears_as','contrasts_with','opposite_of','precedes']},
];
const ALL_RELS=[...new Set(FAMILIES.flatMap(f=>f.rels))];

/* Human wording is separate from canonical storage keys.
   This keeps exported graph semantics stable while avoiding snake_case / odd
   relation wording in the UI. */
const REL_UI={
  causes:'causes', affects:'affects', damages:'damages', facilitates:'facilitates',
  provides:'provides', determines:'determines', repairs:'repairs', maintains:'maintains',
  misses:'fails to detect / misses', produces:'produces', cleaves:'cleaves / breaks down',
  modifies:'modifies', inhibits:'inhibits', activates:'activates', induces:'induces',
  triggers:'triggers', prevents:'prevents', stimulates:'stimulates', suppresses:'suppresses',
  required_for:'is required for',
  is_part_of:'is part of', composed_of:'is composed of', of:'of', located_in:'is located in',
  contains:'contains / has', crosses:'crosses', transports:'transports',
  derived_from:'is derived from', deficient_in:'is deficient in', acquires:'acquires',
  is_a:'is a type of', subtype_of:'is a subtype of', member_of:'is a member of',
  classified_by:'is classified by',
  has_property:'has property / feature', has_state:'has state', has_manner:'occurs / proceeds in this manner',
  binds_to:'binds to', has_affinity_for:'has affinity for', receptor_for:'is receptor for',
  ligand_for:'is ligand for', substrate_of:'is substrate of', cofactor_for:'is cofactor for',
  metabolizes:'metabolizes', uses:'uses', signals:'signals through / to',
  dissociates_from:'dissociates from', targets:'targets / acts on',
  interacts_with:'interacts with',
  increases:'increases', decreases:'decreases', upregulates:'upregulates',
  downregulates:'downregulates', depolarizes:'depolarizes', polarizes:'polarizes',
  associated_with:'is associated with', presents_with:'presents with', has_prodrome:'has prodrome / early symptoms',
  indicates:'indicates / supports diagnosis of', seen_in:'is seen in',
  transmitted_by:'is transmitted by', predisposes_to:'predisposes to',
  infects:'infects', discovered:'is detected / discovered by',
  treated_by:'is treated by', contraindicated_in:'is contraindicated in',
  used_for:'is used for', sensitive_to:'is sensitive to', resistant_to:'is resistant to',
  potentiates:'potentiates', antagonizes:'antagonizes',
  lateral_to:'is lateral to', medial_to:'is medial to', superior_to:'is superior to',
  inferior_to:'is inferior to', anterior_to:'is anterior to', posterior_to:'is posterior to',
  proximal_to:'is proximal to', distal_to:'is distal to', superficial_to:'is superficial to',
  deep_to:'is deep to', inside_of:'is inside', outside_of:'is outside',
  survives_in:'survives in', escapes:'escapes', surrounds:'surrounds',
  adjacent_to:'is adjacent to', left_of:'is left of', right_of:'is right of',
  drains_into:'drains into', supplies:'supplies', innervates:'innervates',
  similar_to:'is similar to', appears_as:'appears as', contrasts_with:'contrasts with',
  opposite_of:'is opposite to', precedes:'precedes'
};
const relUI=r=>REL_UI[r]||String(r||'').replace(/_/g,' ');
  /* mutated by applyCustomVerbs */
/* ---------- STATES: the adjective word type ----------
   A state is not a thing, so it should not be a node like any other. These are
   scalar or binary qualities that come in opposing pairs, which is what makes
   them worth typing separately: the opposite of the true answer is a guaranteed
   wrong answer, and that is the sharpest distractor a question can have. */
const STATES=[
  {axis:'level',   pos:'raised',      neg:'lowered',
   posS:['raised','elevated','high','higher','increased','greater','more','hyper','excessive','above normal'],
   negS:['lowered','decreased','low','lower','reduced','less','fewer','hypo','deficient','below normal','depleted']},

/* Every canonical relation name is also a usable verb. The Syntax panel lists
   these as the vocabulary, so "IgG is_a immunoglobulin" has to work — and it is
   what a language model reaches for when asked to use this notation. */
/* Multi-word phrasings also accepted snake_cased — "caused_by", "treated_by",
   "classified_by" — because that is the shape a model reaches for. */
(()=>{
  const extra=[];
  VERBS.forEach(([surf,rel,flip])=>{
    surf.split('|').forEach(f=>{
      if(!/ /.test(f)||/[()?:|\\]/.test(f))return;   /* skip anything with regex syntax in it */
      const snake=f.replace(/^(is|are|was|were)\s+/i,'').trim().replace(/\s+/g,'_');
      if(snake.includes('_'))extra.push([snake,rel,flip]);
    });
  });
  const seen=new Set();
  extra.forEach(e=>{
    if(seen.has(e[0])||VERBS.some(v=>v[0].split('|').includes(e[0])))return;
    seen.add(e[0]);VERBS.push(e);
  });
})();
ALL_RELS.forEach(r=>{
  if(!VERBS.some(v=>v[0].split('|').includes(r)))VERBS.push([r,r]);
  const spaced=r.replace(/_/g,' ');
  if(spaced!==r&&!VERBS.some(v=>v[0].split('|').includes(spaced)))VERBS.push([spaced,r]);
});
/* ---- user-defined verbs ----
   Kept in the graph so they export and import with everything else, and applied
   over a snapshot of the built-in table so they can be edited or removed. */
const BASE_VERBS=VERBS.map(v=>v.slice());
const BASE_FAM=FAMILIES.map(f=>({...f,rels:f.rels.slice()}));
function applyCustomVerbs(){
  FAMILIES.forEach((f,i)=>{f.rels=BASE_FAM[i].rels.slice()});
  VERBS.length=0;BASE_VERBS.forEach(v=>VERBS.push(v.slice()));
  ((G&&G.customVerbs)||[]).forEach(cv=>{
    if(!cv||!cv.surf||!cv.rel)return;
    if(cv.family){
      const f=FAMILIES.find(x=>x.key===cv.family);
      if(f&&!f.rels.includes(cv.rel))f.rels.push(cv.rel);
    }
    /* first in the list, so a custom phrasing wins ties against a generic one */
    VERBS.unshift([cv.surf,cv.rel,!!cv.flip]);
  });
  const all=[...new Set(FAMILIES.flatMap(f=>f.rels))];
  ALL_RELS.length=0;all.forEach(r=>ALL_RELS.push(r));
  ALL_RELS.forEach(r=>{
    if(!VERBS.some(v=>v[0].split('|').includes(r)))VERBS.push([r,r]);
    const sp=r.replace(/_/g,' ');
    if(sp!==r&&!VERBS.some(v=>v[0].split('|').includes(sp)))VERBS.push([sp,r]);
  });
  _vaBuilt=false;
  if(typeof bump==='function')bump();
}
async function addCustomVerb(surf,rel,family,flip){
  surf=String(surf||'').trim().toLowerCase();
  rel=String(rel||'').trim().toLowerCase().replace(/\s+/g,'_');
  if(!surf||!rel)return toast('Need both a phrase and a relation');
  try{new RegExp('^(.{2,120}?)\\s+(?:'+surf+')\\s+(.{1,120})$','i')}
  catch(e){return toast('That phrase has characters the matcher cannot use')}
  G.customVerbs=G.customVerbs||[];
  if(G.customVerbs.some(v=>v.surf===surf))return toast('Already added');
  G.customVerbs.push({surf,rel,family:family||'',flip:!!flip});
  applyCustomVerbs();
  parsed=parse(src);              /* re-read the editor with the new verb in play */
  await save();refresh();render();
  toast(`"${surf}" now means ${rel}${flip?' (reversed)':''}`);
}
async function removeCustomVerb(i){
  G.customVerbs=(G.customVerbs||[]).filter((_,k)=>k!==i);
  applyCustomVerbs();parsed=parse(src);await save();refresh();render();toast('Removed');
}

/* merge an exported file into the current graph, matching nodes by name */
function mergeGraph(inc){
  const map={},relMap={};
  let newDefs=0,newRels=0,newSeqs=0,mergedFeat=0,longerSeqs=0,newVerbs=0;
  (inc.defs||[]).forEach(d=>{
    const ex=resolve(d.term);
    if(ex&&ex.id){
      map[d.id]=ex.id;const cur=byId(ex.id);
      /* Features are MERGED, not merely filled. The old rule only copied them
         across when the local node had none, so if you had edited the same term
         in both copies, one set of edits was silently dropped. */
      const bare=f=>canon(String(f&&f.text||'').replace(/\[\[|\]\]/g,''));
      const have=new Set((cur.features||[]).map(bare));
      const add=(d.features||[]).filter(f=>bare(f)&&!have.has(bare(f)));
      if(add.length){cur.features=(cur.features||[]).concat(add);cur.stub=false;mergedFeat+=add.length}
      if(!cur.cls&&d.cls)cur.cls=d.cls;
      if(!cur.system&&d.system)cur.system=d.system;
      if(!cur.topic&&d.topic)cur.topic=d.topic;
      if(!(cur.path||[]).length&&(d.path||[]).length)cur.path=d.path;
      cur.tags=[...new Set([...(cur.tags||[]),...(d.tags||[])])];
      cur.aliases=[...new Set([...(cur.aliases||[]),...(d.aliases||[])])];
    }else{const nid=uid('def');map[d.id]=nid;G.defs.push({...d,id:nid});bump();newDefs++}
  });
  (inc.rels||[]).forEach(r=>{
    const a=map[r.aId],b=map[r.bId];if(!a||!b)return;
    const dup=G.rels.find(x=>x.aId===a&&x.bId===b&&x.relation===r.relation&&!!x.neg===!!r.neg);
    if(dup){relMap[r.id]=dup.id;return}
    const nid=uid('rel');relMap[r.id]=nid;newRels++;
    G.rels.push({...r,id:nid,aId:a,bId:b,
      effect:r.effect&&map[r.effect.entityId]?{...r.effect,entityId:map[r.effect.entityId]}:null,
      conditions:(r.conditions||[]).map(c=>({...c,entityId:c.entityId?(map[c.entityId]||null):null}))});
  });
  (inc.seqs||[]).forEach(q=>{
    const mine=G.seqs.find(x=>canon(x.name)===canon(q.name));
    const steps=(q.steps||[]).map(st=>({...st,links:(st.links||[]).map(l=>map[l]).filter(Boolean)}));
    if(mine){
      /* A sequence with the same name used to be skipped outright, so a version
         where you had extended it lost the extra steps. Take whichever is longer. */
      if(steps.length>(mine.steps||[]).length){mine.steps=steps;longerSeqs++}
      return;
    }
    newSeqs++;
    G.seqs.push({...q,id:uid('seq'),steps});
  });
  /* Whiteboard content is part of the graph export too. Imported boards are
     appended with a small offset and their graph/relationship ids are remapped. */
  if(inc.whiteboard){
    G.whiteboard=G.whiteboard||{strokes:[],nodes:[],arrows:[]};
    const W=G.whiteboard,I=inc.whiteboard,off=(W.strokes.length||W.nodes.length)?36:0;
    const sid={},nid={};
    (I.strokes||[]).forEach(st=>{const id=uid('wbs');sid[st.id]=id;W.strokes.push({...st,id,pts:(st.pts||[]).map(p=>({...p,x:(p.x||0)+off,y:(p.y||0)+off}))})});
    (I.nodes||[]).forEach(n=>{const id=uid('wbn');nid[n.id]=id;W.nodes.push({...n,id,graphId:map[n.graphId]||n.graphId,
      x:(n.x||0)+off,y:(n.y||0)+off,strokeIds:(n.strokeIds||[]).map(x=>sid[x]).filter(Boolean)})});
    (I.arrows||[]).forEach(a=>{if(!nid[a.from]||!nid[a.to])return;W.arrows.push({...a,id:uid('wba'),from:nid[a.from],to:nid[a.to],relId:relMap[a.relId]||a.relId})});
    W.annotations=W.annotations||[];(I.annotations||[]).forEach(a=>W.annotations.push({...a,id:uid('wban'),x:(a.x||0)+off,y:(a.y||0)+off,strokeIds:(a.strokeIds||[]).map(x=>sid[x]).filter(Boolean),targetGraphId:map[a.targetGraphId]||a.targetGraphId}));
    W.training=W.training||{arrowPos:[],arrowNeg:[],nodePos:[],nodeNeg:[]};
    const T=I.training||{};if(typeof mgHwrMergeV6==='function'){mgHwrMergeV6(MG_HWR_MEMORY,T);mgHwrPersistSoonV6()}['arrowPos','arrowNeg','nodePos','nodeNeg'].forEach(k=>{(T[k]||[]).slice(-20).forEach(v=>W.training[k].push(v));W.training[k]=W.training[k].slice(-50)});
    W.training.samples=W.training.samples||[];(T.samples||[]).slice(-120).forEach(x=>W.training.samples.push(x));W.training.samples=W.training.samples.slice(-300);
  }
  /* custom verbs were not carried at all */
  const mySurf=new Set((G.customVerbs||[]).map(v=>v.surf));
  (inc.customVerbs||[]).forEach(v=>{
    if(!v||!v.surf||mySurf.has(v.surf))return;
    (G.customVerbs=G.customVerbs||[]).push(v);mySurf.add(v.surf);newVerbs++;
  });
  if(newVerbs&&typeof applyCustomVerbs==='function')applyCustomVerbs();
  /* question history: node tallies remap by node, question keys by relationship */
  Object.entries(inc.nodeStats||{}).forEach(([k,v])=>{
    const id=map[k]||k;const c=G.nodeStats[id]||{right:0,wrong:0};
    /* the two copies almost always share ancestry, so adding would double-count
       the same answers; the higher of the two is the honest reading */
    G.nodeStats[id]={right:Math.max(c.right,v.right||0),wrong:Math.max(c.wrong,v.wrong||0)};
  });
  Object.entries(inc.stats||{}).forEach(([k,v])=>{
    const nk=k.replace(/^(rel|relr|neg|cond):([^:]+)/,(m,p,id)=>p+':'+(relMap[id]||id))
              .replace(/^(slot|def|tax):([^:]+)/,(m,p,id)=>p+':'+(map[id]||id));
    const c=G.stats[nk]||{seen:0,right:0,wrong:0};
    G.stats[nk]={seen:Math.max(c.seen,v.seen||0),right:Math.max(c.right,v.right||0),
                 wrong:Math.max(c.wrong,v.wrong||0),last:Math.max(c.last||0,v.last||0)};
  });
  G.defs.forEach(d=>{
    (d.features||[]).forEach(f=>f.links=(f.links||[]).map(l=>map[l]||l).filter(byId));
    d.termLinks=(d.termLinks||[]).map(l=>map[l]||l).filter(byId);
  });
  return {newDefs,newRels,newSeqs,mergedFeat,longerSeqs,newVerbs};
}

async function shareOrDownloadJSON(filename,text){
  try{

    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:filename});
      toast('Choose Save to Files, AirDrop, or another destination');
      return true;
    }
  }catch(e){
    if(e&&e.name==='AbortError')return false;
  }
  try{
    const b=new Blob([text],{type:'application/json'});
    const url=URL.createObjectURL(b);
    const a=document.createElement('a');
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('Export started. On iPad, check Downloads in Safari/Files.');
    return true;
  }catch(e){
    toast('Could not create a file here — use Copy JSON below');
    return false;
  }
}

          inc&&inc.training?inc.training:

  if(!t)return toast('That file does not contain MedGraph handwriting training');
  G.whiteboard=G.whiteboard||{};

    const a=Array.isArray(dst[k])?dst[k]:[], b=Array.isArray(t[k])?t[k]:[];
    const seen=new Set(a.map(x=>JSON.stringify(x)));

    dst[k]=a;

  Object.entries(t).forEach(([k,v])=>{
    if(['samples','arrowPos','arrowNeg','nodePos','nodeNeg'].includes(k))return;

    else if(v&&typeof v==='object'&&!Array.isArray(v)&&dst[k]&&typeof dst[k]==='object'&&!Array.isArray(dst[k]))

    let prev=effect?effect.entity:UM(b);

  records.forEach(r=>{

function termIndex(){

  const a=[];G.defs.forEach(d=>{a.push({t:d.term,id:d.id});(d.aliases||[]).forEach(x=>a.push({t:x,id:d.id}))});
  _tiCache=a.filter(x=>x.t&&x.t.length>2)

  [/icity$/i,['ic','']],[/tic$/i,['sis','t']],[/sis$/i,['tic']],
  [/ic$/i,['','in','y','icity']],[/in$/i,['ic']],

  [/ation$/i,['ate','e','ing']],[/ate$/i,['ation']],
  [/ity$/i,['ic','']],[/y$/i,['ic']],[/ing$/i,['e','ion','']],

function relinkTerms(){

    const add=want.filter(x=>!have.includes(x)&&!(d.noTermLink||[]).includes(x));

function composeStarterFromLine(line){
  line=String(line||'').trim();
  if(!line||/^[-+]/.test(line)||/^[@/#]/.test(line))return '';

  let lead='';
  if(line.includes('::'))lead=line.split('::')[0];
  else if(line.includes(':='))lead=line.split(':=')[0];
  else{
    const ar=ARROW.exec(line);
    if(ar)lead=ar[1];
    else{
      const h=findVerb(line);
      if(h)lead=h.left;
    }
  }
  lead=String(lead||'')
    .replace(/\s+\[[a-z][a-z0-9_-]*\]\s*$/i,'')
    .replace(/\s+\([^()]*(?:,\s*[^()]*)*\)\s*$/,'')
    .replace(/\s+/g,' ').trim();
  return lead;
}

  /* Current line first; if it is a continuation/blank, walk upward. */
  for(let i=lines.length-1;i>=0;i--){
    const lead=composeStarterFromLine(lines[i]);

  }

  const ta=e.currentTarget||document.getElementById('src');

  const c=ta.selectionStart,v=ta.value;
  const lineEnd=v.indexOf('\n',c);

     to the browser/keyboard rather than unexpectedly restructuring text. */

  const lead=composePreviousStarter(ta);

  e.preventDefault();
  const ins='\n'+lead+' ';
  ta.value=v.slice(0,c)+ins+v.slice(c);
  const nc=c+ins.length;
  ta.setSelectionRange(nc,nc);

function composeClassAtCaret(ta){

async function unzip(buf,pick){

    if(dv.getUint32(i,true)===0x06054b50){eo=i;break}

    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    p+=46+nl+el+cl;
    if(!pick(name))continue;
    const lnl=dv.getUint16(lho+26,true),lel=dv.getUint16(lho+28,true);
    const data=u8.slice(lho+30+lnl+lel,lho+30+lnl+lel+csize);

    if(method===0)text=dec.decode(data);

}

async function fileToText(f){

function surfacesFor(rel){

  VERBS.forEach(([surf,r,flip])=>{if(r!==rel)return;
    surf.split('|').forEach(f=>(flip?inv:act).push(f))});
  return {act:[...new Set(act)],inv:[...new Set(inv)]};
}

function degree(id){
  let n=(byId(id)||{}).termLinks?byId(id).termLinks.length:0;
  G.defs.forEach(d=>{if(d.id!==id&&(d.termLinks||[]).includes(id))n++});
  G.rels.forEach(r=>{if(r.aId===id||r.bId===id)n++;if(r.effect&&r.effect.entityId===id)n++;(r.conditions||[]).forEach(c=>{if(c.entityId===id)n++})});
  G.defs.forEach(d=>(d.features||[]).forEach(f=>{if((f.links||[]).includes(id))n++}));
  G.seqs.forEach(s=>(s.steps||[]).forEach(st=>{if((st.links||[]).includes(id))n++}));
  return n;
}

/* Anything true of an ancestor is true of its descendants. Those facts are not
   copied into the graph — that would bloat it and blur where a fact came from —

function taxParents(id,seen=new Set()){
  G.rels.filter(r=>!r.neg&&TAXR.includes(r.relation)&&r.aId===id).forEach(r=>{
    if(!seen.has(r.bId)){seen.add(r.bId);taxParents(r.bId,seen)}});
  return seen;
}
function inheritedFacts(id){
  const own=new Set();
  G.rels.forEach(r=>{
    if(r.aId===id)own.add('o|'+r.relation+'|'+r.bId);
    if(r.bId===id)own.add('i|'+r.relation+'|'+r.aId);
  });
  const out=[];
  taxParents(id).forEach(anc=>{
    G.rels.forEach(r=>{
      if(r.neg||TAXR.includes(r.relation))return;
      if(r.aId===anc&&r.bId!==id&&!own.has('o|'+r.relation+'|'+r.bId))
        out.push({via:anc,dir:'out',rel:r.relation,other:r.bId,src:r});
      else if(r.bId===anc&&r.aId!==id&&!own.has('i|'+r.relation+'|'+r.aId))
        out.push({via:anc,dir:'in',rel:r.relation,other:r.aId,src:r});
    });
  });
  const seen=new Set();
  return out.filter(x=>{const k=x.dir+x.rel+x.other;if(seen.has(k))return false;seen.add(k);return true});
}

  const men=G.defs.filter(d=>d.id!==id&&(d.features||[]).some(f=>(f.links||[]).includes(id)));
  const sq=G.seqs.filter(s=>(s.steps||[]).some(st=>(st.links||[]).includes(id)));
  return {out,ctx,men,sq};
}

function classCard(d){
  const C=clsOf(d.cls);if(!C)return '';
  const inh=inheritedFacts(d.id);
  const filled=C.slots.map(sl=>{
    const hits=G.rels.filter(r=>{
      if(r.slot===sl.k)return sl.flip?r.bId===d.id:r.aId===d.id;
      if(r.relation!==sl.rel||r.neg)return false;
      return sl.flip?r.bId===d.id:r.aId===d.id;
    }).map(r=>sl.flip?r.aId:r.bId);
    const ids=[...new Set(hits)];
    /* a slot an ancestor already answers is not an empty slot */
    const from=ids.length?[]:inh.filter(x=>x.rel===sl.rel&&x.dir===(sl.flip?'in':'out'));
    return {sl,ids,from};
  });
  const done=filled.filter(f=>f.ids.length||f.from.length).length;
  return `<div class="sect"><span class="eyebrow" style="color:${C.color}">${esc(C.label)} · ${done}/${C.slots.length} slots filled</span><span class="ln"></span></div>
    <div class="slots">${filled.map(f=>`<div class="slotrow ${f.ids.length?'':'empty'}">
      <span class="slotk">${esc(f.sl.label)}</span>
      <span>${f.ids.length?f.ids.map(i=>nodeChip(i)).join(' ')
        :(f.from.length?f.from.slice(0,3).map(x=>`${nodeChip(x.other)}<span class="hint" style="margin:0 0 0 5px">via ${esc(termOf(x.via))}</span>`).join(' ')
        :`<button class="slotadd" onclick="seedSlot('${d.id}','${f.sl.k}')">+ add</button>`)}</span>
      <span class="slotrel mono">${esc(relUI(f.sl.rel))}${f.sl.flip?' ←':''}</span></div>`).join('')}</div>`;
}

function autolink(ta,excludeId){

    if(!hits.length){box.style.display='none';box.innerHTML='';return}

function resolveBrackets(text,meta){
  const links=[];
  text.split(/(\[\[[^\]]*\]\])/).filter(p=>/^\[\[/.test(p)).forEach(p=>{
    const id=ensure(p.slice(2,-2),meta);if(!links.includes(id))links.push(id);
  });
  return links;
}

function renameStatKey(oldTerm,newTerm,key){
  const oldC=canon(oldTerm),newC=canon(newTerm);
  if(!oldC||oldC===newC)return key;
  const m=String(key||'').match(/^([^:]+):(.*)$/);
  if(!m)return key;
  const kind=m[1],parts=m[2].split('\u00bb');

  let positions=[];
  if(['rel','relr','neg','cond'].includes(kind))positions=[0,2];
  else if(['slot','def','tax'].includes(kind))positions=[0];
  else return key; /* sequence keys are sequence-name based, not node-name based */

  positions.forEach(i=>{if(parts[i]===oldC)parts[i]=newC});
  return kind+':'+parts.join('\u00bb');
}
function migrateQuestionStatsForRename(oldTerm,newTerm){
  if(!G.stats||canon(oldTerm)===canon(newTerm))return;
  const next={};
  Object.entries(G.stats).forEach(([k,v])=>{
    const nk=renameStatKey(oldTerm,newTerm,k),cur=next[nk];
    if(!cur)next[nk]={...v};
    else{
      next[nk]={
        seen:Math.max(cur.seen||0,v.seen||0),
        right:Math.max(cur.right||0,v.right||0),
        wrong:Math.max(cur.wrong||0,v.wrong||0),
        last:Math.max(cur.last||0,v.last||0)
      };
    }
  });
  G.stats=next;
}

async function saveDef(id){
  const term=document.getElementById('d-term').value.trim();if(!term)return toast('Term required');
  const oldTerm=id&&byId(id)?byId(id).term:'';
  const feats=dFeats.map(t=>t.trim()).filter(Boolean).map(text=>({text,links:resolveBrackets(text)}));
  let aliases=document.getElementById('d-alias').value.split(',').map(s=>s.trim()).filter(Boolean);
  const renamed=!!(id&&oldTerm&&canon(oldTerm)!==canon(term));
  if(renamed&&!aliases.some(a=>canon(a)===canon(oldTerm))&&canon(oldTerm)!==canon(term))aliases.unshift(oldTerm);
  aliases=[...new Map(aliases.map(a=>[canon(a),a])).values()].filter(a=>canon(a)!==canon(term));
  const rec={term,cls:(document.getElementById('d-cls')||{value:''}).value,
    aliases,
    system:document.getElementById('d-sys').value.trim(),topic:document.getElementById('d-top').value.trim(),
    tags:document.getElementById('d-tags').value.split(',').map(s=>s.trim()).filter(Boolean),features:feats,stub:!feats.length};
  if(id){Object.assign(byId(id),rec);if(renamed)migrateQuestionStatsForRename(oldTerm,term);selected=id}
  else{const ex=resolve(term);if(ex.exists){Object.assign(byId(ex.id),rec);selected=ex.id}else{const n={id:uid('def'),created:Date.now(),...rec};G.defs.push(n);bump();selected=n.id}}
  const back=relinkAll();
  await save();view={mode:'browse'};refresh();render();
  toast((renamed?'Renamed · connections preserved · old name kept as alias':'Saved')+(back?` · ${back} earlier mention${back>1?'s':''} linked up`:''));
}
async function delDef(id){
  if(!confirm('Delete this node? Edges referencing it are removed too.'))return;
  G.defs=G.defs.filter(d=>d.id!==id);
  G.rels=G.rels.filter(r=>r.aId!==id&&r.bId!==id&&!(r.effect&&r.effect.entityId===id));
  G.rels.forEach(r=>r.conditions=(r.conditions||[]).filter(c=>c.entityId!==id));
  G.defs.forEach(d=>(d.features||[]).forEach(f=>f.links=(f.links||[]).filter(x=>x!==id)));
  selected=null;await save();view={mode:'browse'};refresh();render();
}

    effect:rHasEffect?{relation:rEffRel,entityId:pickers.E,neg:false}:null,
    conditions:rConds.map((c,i)=>({type:c.type,entityId:pickers['C'+i]||null,note:(c.note||'').trim()})).filter(c=>c.entityId||c.note),

/* ==================== QBANK ====================
   Questions are generated from the graph itself, not from a language model.
   Typed edges, class slots, conditions, negations and sequences each imply a
   question shape, and distractors are drawn from nodes that play the SAME role
   elsewhere in the graph — which is what makes them plausible rather than silly. */
const RELPHRASE={of:'is related by “of” to',has_manner:'occurs in the manner',has_prodrome:'has a prodrome including',targets:'targets',interacts_with:'interacts with',required_for:'is required for',is_part_of:'is part of',composed_of:'is composed of',
 located_in:'is located in',is_a:'is a type of',subtype_of:'is a subtype of',member_of:'is a member of',
 has_property:'has the property',binds_to:'binds to',has_affinity_for:'has affinity for',
 receptor_for:'is the receptor for',ligand_for:'is the ligand for',substrate_of:'is a substrate of',
 cofactor_for:'is a cofactor for',associated_with:'is associated with',seen_in:'is seen in',

    if(seen.has(sp.key))continue;
    seen.add(sp.key);
    let q=null;
    try{q=sp.make()}catch(e){q=null}
    if(q)picked.push(q);
  }
  return {picked,total:specs.length};
}

async function qbStart(){

  QB.qs=r.picked;QB.pool=r.total;QB.i=0;QB.answers={};QB.setup=false;PAD.hover=null;render();

function qbAnswer(i){
  const q=QB.qs[QB.i];if(!q||QB.answers[QB.i]!==undefined)return;
  QB.answers[QB.i]=i;
  const right=q.options[i].ok;
  G.stats=G.stats||{};
  const s=G.stats[q.key]||{seen:0,right:0,wrong:0};
  s.seen++;right?s.right++:s.wrong++;s.last=Date.now();
  G.stats[q.key]=s;
  /* per-node tallies, for the mastery map */
  G.nodeStats=G.nodeStats||{};
  (q.nodes||[]).filter(byId).forEach(id=>{
    const ns=G.nodeStats[nodeKey(id)]||{right:0,wrong:0};
    right?ns.right++:ns.wrong++;G.nodeStats[nodeKey(id)]=ns;
  });

async function qbClaim(){
  const q=QB.qs[QB.i],pick=QB.answers[QB.i];
  if(!q||pick===undefined||q.options[pick].ok)return;
  const r=G.rels.find(x=>x.id===q.relId);
  if(!r)return toast('Cannot tell which edge this was');
  const other=resolve(q.options[pick].t);
  if(!other||!other.id)return toast('That option is not a node');
  const fwd=q.fwd!==false;
  const a=fwd?r.aId:other.id, b=fwd?other.id:r.bId;
  if(G.rels.some(x=>x.aId===a&&x.bId===b&&x.relation===r.relation&&!x.neg))return toast('Already there');
  G.rels.push({id:uid('rel'),created:Date.now(),aId:a,relation:r.relation,bId:b,neg:false,
    effect:null,conditions:[],context:'',
    system:r.system||'',topic:r.topic||'',tags:['added-while-testing']});
  const st=G.stats[q.key];if(st){st.wrong=Math.max(0,st.wrong-1);st.right++}
  (q.nodes||[]).forEach(id=>{const n=G.nodeStats[id];if(n){n.wrong=Math.max(0,n.wrong-1);n.right++}});
  q.options[pick].ok=true;

/* Turn every known term inside a block of text into a link to its node.
   Matches are collected first and overlaps dropped, so a longer term always wins
   and nothing gets spliced inside an already-inserted tag. */
function linkTerms(html){
  return html.split(/(<[^>]+>)/).map(seg=>{
    if(!seg||seg[0]==='<')return seg;
    const hits=[];
    mentionsIn(seg,null).forEach(m=>{
      const re=termRe(m.t,isAcronym(m.t)?'g':'gi');
      let x;
      while((x=re.exec(seg))){
        const st=x.index+x[1].length;
        hits.push({s:st,e:st+x[2].length,id:m.id});
        re.lastIndex=st+x[2].length;
      }
    });
    hits.sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s));
    const keep=[];let end=-1;
    hits.forEach(h=>{if(h.s>=end){keep.push(h);end=h.e}});
    let out='',at=0;
    keep.forEach(h=>{out+=seg.slice(at,h.s)+`<span class="lnk" onclick="pick('${h.id}')">${seg.slice(h.s,h.e)}</span>`;at=h.e});
    return out+seg.slice(at);
  }).join('');
}

function defCard(term,state){

  const body=d&&(d.features||[]).length
    ? esc(d.features[0].text.replace(/\[\[|\]\]/g,''))

  return `<div class="defcard ${state||''}">
    ${d?`<h5 onclick="pick('${d.id}')">${esc(d.term)}</h5>`:`<h5>${esc(term)}</h5>`}
    <p>${body}</p>
    ${d?`<div class="meta">${C?esc(C.label)+' · ':''}${esc(d.topic||d.system||'')}${
      d.stub?' · <b style="color:var(--stub)">stub</b>':''}</div>`:''}
  </div>`;
}

  return `<div class="defcol"><div class="eyebrow" style="margin-bottom:2px">What each one is</div>

/* ==================== ENRICH ====================
   Reads every definition, treats each clause of each feature as a sentence with
   that node as the subject, and proposes a typed relationship whenever the
   object turns out to be another node you already have. Nothing is written
   without you accepting it — a wrong edge is worse than a missing one. */
let ENR={scan:null,done:new Set(),busy:false,tab:'proposals',minConf:'medium'};
function enrichClauses(text){
  return String(text).replace(/\[\[|\]\]/g,'')
    .split(/\s*;\s*|\s+(?:that|which|and then)\s+|,\s+(?:and\s+)?(?=[a-z])/i)
    .map(x=>x.trim().replace(/^[,.\s]+|[,.\s]+$/g,''))
    .filter(x=>x.length>3);
}
function enrichScan(){
  const t0=Date.now();
  const proposals=[],mentions=[],orphans=[],bare=[];
  const idx=qbIndex();
  /* who names whom — built once, instead of rescanning every node for every node */
  const inbound={};
  G.defs.forEach(x=>{
    const add=id=>{if(id&&id!==x.id)(inbound[id]=inbound[id]||new Set()).add(x.id)};
    (x.termLinks||[]).forEach(add);
    (x.features||[]).forEach(f=>(f.links||[]).forEach(add));
  });
  const linked=(a,b)=>G.rels.some(r=>(r.aId===a&&r.bId===b)||(r.aId===b&&r.bId===a));
  const sameFam=(a,b,rel)=>G.rels.some(r=>!r.neg&&((r.aId===a&&r.bId===b)||(r.aId===b&&r.bId===a))
    &&famOf(r.relation).key===famOf(rel).key);
  G.defs.forEach(d=>{
    /* --- 1. read the definition as sentences about this node --- */
    (d.features||[]).forEach((f,fi)=>{
      enrichClauses(f.text).forEach(cl=>{
        /* running the verb table over every clause was the whole cost; a clause
           that names no other node can never produce an edge */
        if(!mentionsIn(cl,d.term).length)return;
        const sentence=d.term+' '+cl.replace(/^(is|are|was|were)\s+/i,m=>m);
        let neg=false,v=findVerb(sentence);
        if(!v){const sn=stripNeg(sentence);if(sn.neg){v=findVerb(sn.text);neg=!!v}}
        if(!v)return;
        if(canon(v.a)!==canon(d.term)&&canon(v.b)!==canon(d.term))return;
        const otherRaw=canon(v.a)===canon(d.term)?v.b:v.a;
        const dirOut=canon(v.a)===canon(d.term);
        const hit=resolve(otherRaw);
        if(!hit||!hit.id||hit.id===d.id)return;
        const a=dirOut?d.id:hit.id, b=dirOut?hit.id:d.id;
        if(G.rels.some(r=>r.aId===a&&r.bId===b&&r.relation===v.rel&&!!r.neg===neg))return;
        let conf='high';
        if(hit.fuzzy)conf='medium';
        if(v.rel==='has_property'||v.rel==='contains')conf='medium';
        if(sameFam(a,b,v.rel))conf='low';
        if(linked(a,b)&&conf==='high')conf='medium';
        proposals.push({a,b,rel:v.rel,neg,conf,from:d.id,fi,source:cl,
          key:a+'|'+v.rel+'|'+b+'|'+neg});
      });
    });
    /* --- 2. names it mentions but is not actually related to --- */
    const seen=new Set();
    const mentionsOf=[...new Set([...(d.termLinks||[]),
      ...(d.features||[]).flatMap(f=>f.links||[])])];
    mentionsOf.forEach(m=>{
      if(m===d.id||seen.has(m)||!byId(m))return;seen.add(m);
      if(linked(d.id,m))return;
      const o=byId(m);
      /* same topic first, then pairs where the other end is thin on edges —
         those are the ones a new relationship actually helps */
      const score=(o.topic&&o.topic===d.topic?2:0)+((idx.nbr[m]||new Set()).size<3?1:0);
      mentions.push({from:d.id,to:m,score});
    });
    /* --- 3. and 4. the two kinds of hole --- */
    const conn=(idx.nbr[d.id]||new Set()).size
      +(d.termLinks||[]).length
      +(d.features||[]).reduce((n,f)=>n+((f.links||[]).length),0)
      +((inbound[d.id]||new Set()).size);
    if(!conn)orphans.push(d.id);
    if(!(d.features||[]).length)bare.push(d.id);
  });
  /* keep the strongest reading of each proposed pair */
  const best={};
  proposals.forEach(p=>{
    const rank={high:3,medium:2,low:1};
    if(!best[p.key]||rank[p.conf]>rank[best[p.key].conf])best[p.key]=p;
  });
  return {proposals:Object.values(best).sort((x,y)=>
      ({high:0,medium:1,low:2})[x.conf]-({high:0,medium:1,low:2})[y.conf]
      ||termOf(x.a).localeCompare(termOf(y.a))),
    mentions:mentions.sort((a,b)=>b.score-a.score),orphans,bare,ms:Date.now()-t0};
}
function openEnrich(){ENR.scan=null;view={mode:'enrich'};render();}
async function enrichAccept(key){
  const p=(ENR.scan.proposals||[]).find(x=>x.key===key);

  G.rels.push({id:uid('rel'),created:Date.now(),aId:p.a,relation:p.rel,bId:p.b,neg:!!p.neg,
    effect:null,conditions:[],context:'',
    system:(byId(p.from)||{}).system||'',topic:(byId(p.from)||{}).topic||'',
    tags:['from-definition']});

          <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
            <span class="eyebrow" style="color:${p.conf==='high'?'var(--ok)':p.conf==='medium'?'var(--warn)':'var(--muted)'}">${p.conf}</span>
            <button class="mini" onclick="enrichAccept('${esc(p.key).replace(/'/g,'')}')">add</button>
            <button class="mini x" onclick="enrichReject('${esc(p.key).replace(/'/g,'')}')">skip</button></span></div>
        <div class="ctx">from <button class="chip" onclick="pick('${p.from}')">${esc(termOf(p.from))}</button>
          <span style="font-style:italic">“${esc(p.source)}”</span></div>
      </div>`).join('')}
      ${live.length>200?`<div class="hint">showing the first 200 of ${live.length}</div>`:''}`
      :'<div class="empty">Nothing left to propose — every sentence in your definitions that names another node is already an edge.</div>';
  }
  if(ENR.tab==='mentions'){
    body=S.mentions.length?`<div class="hint" style="margin:0 0 10px">These pairs appear together in a definition but have no
      relationship between them — the wording gave no verb, so pick one yourself. Sorted so that pairs in the same topic,
      and pairs where the second term has few edges of its own, come first.</div>
      ${S.mentions.slice(0,120).map((m,i)=>`<div class="keyrow" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
        ${nodeChip(m.from)}<select id="mrel${i}" style="width:auto;max-width:190px">${relOptions}</select>${nodeChip(m.to)}
        <button class="mini" style="margin-left:auto" onclick="enrichRelate('${m.from}','${m.to}','mrel${i}')">link</button></div>`).join('')}
      ${S.mentions.length>120?`<div class="hint">showing the first 120 of ${S.mentions.length}</div>`:''}`
      :'<div class="empty">Every mention inside a definition already has a relationship behind it.</div>';
  }
  if(ENR.tab==='orphans'){
    body=S.orphans.length?`<div class="hint" style="margin:0 0 10px">Defined, but joined to nothing at all — not by a
      relationship, not by being named in another definition. Either they need an edge or they do not belong.</div>
      <div class="chips">${S.orphans.map(id=>`<button class="chip" onclick="pick('${id}')">${esc(termOf(id))}</button>`).join('')}</div>`
      :'<div class="empty">No orphans — every node is attached to something.</div>';
  }
  if(ENR.tab==='bare'){
    body=S.bare.length?`<div class="hint" style="margin:0 0 10px">These have edges but no definition of their own, so a
      question about them can only ever test the edge, never the concept.</div>
      <div class="chips">${S.bare.map(id=>`<button class="chip" onclick="pick('${id}')">${esc(termOf(id))}</button>`).join('')}</div>`
      :'<div class="empty">Everything has at least one feature.</div>';
  }
  return `<div class="panel">
    <div class="panel-h"><h2>Enrich</h2>
      <span class="hint" style="margin:0 0 0 auto">read ${G.defs.length} definitions in ${S.ms} ms</span>
      <button class="mini" onclick="ENR.scan=null;ENR.done=new Set();ENR.busy=false;render()">rescan</button></div>
    <div class="chips" style="margin-bottom:14px">
      ${tab('proposals','Relationships your definitions imply',live.length)}
      ${tab('mentions','Named together but unrelated',S.mentions.length)}
      ${tab('orphans','Connected to nothing',S.orphans.length)}
      ${tab('bare','No definition of their own',S.bare.length)}
    </div>
    ${ENR.tab==='proposals'&&live.length?`<div class="hint" style="margin:0 0 10px">
      <b>${counts.high}</b> confident · <b>${counts.medium}</b> worth a look · <b>${counts.low}</b> already covered by a similar edge</div>`:''}
    ${body}</div>`;
}

/* ==================== CONTROLLER ====================
   Joy-Cons pair as gamepads, not keyboards, so this reads the Gamepad API.
   Button numbering is non-standard on a sideways Joy-Con, so every action can be
   rebound by pressing the button you want. On the radial Sequences board the
   stick also works: push toward a spoke, then confirm. */
const PAD_ACTIONS=[['confirm','Choose (trigger)'],['next','Next (right)'],['back','Back (left)'],['end','End'],
  ['o1','Option 1'],['o2','Option 2'],['o3','Option 3'],['o4','Option 4'],['o5','Option 5']];
const PAD_DEFAULT={
  confirm:[6,7,0],          /* either trigger, or the bottom face button */
  next:[5,15,9],            /* right shoulder, d-pad right, or start */
  back:[4,14,8],            /* left shoulder, d-pad left, or select */
  end:[16,17],
  o1:[],o2:[],o3:[],o4:[],o5:[]};   /* aim with the stick instead */
const padArr=v=>Array.isArray(v)?v:(v===undefined||v===null?[]:[v]);
let PAD={idx:null,prev:{},raf:null,binding:null,hover:null,live:'',axes:[0,0],calib:false};
/* A Joy-Con reports its stick in the controller's own frame, so holding it
   upright and holding it sideways put "up" on different axes. This rotates the
   stick vector into screen space. */
const padRot=()=>(G&&typeof G.padRot==='number')?G.padRot:0;
function padAim(x,y){
  const r=padRot()*Math.PI/180,c=Math.cos(r),s2=Math.sin(r);
  return [x*c-y*s2,x*s2+y*c];
}
function padSetRot(deg){G.padRot=deg;PAD.calib=false;save();render();
  toast(deg===0?'Held upright':`Rotated ${deg>0?'+':''}${deg}°`);}
function padCalibrate(){PAD.calib=true;render();toast('Now push the stick straight UP, the way you are holding it');}
function padMap(){
  const m=Object.assign({},PAD_DEFAULT,(G&&G.padMap)||{});
  Object.keys(m).forEach(k=>m[k]=padArr(m[k]));
  return m;
}
function padList(){
  try{return [...(navigator.getGamepads?navigator.getGamepads():[])].filter(Boolean)}catch(e){return []}
}
function padFire(act){
  if(view.mode==='qbank'&&!QB.setup){
    const q=QB.qs[QB.i];
    if(act[0]==='o'&&q&&QB.answers[QB.i]===undefined){
      const k=+act[1]-1;if(k<q.options.length)qbAnswer(k);return;
    }
    if(act==='confirm'){
      if(QB.answers[QB.i]===undefined){
        if(PAD.hover===null)return toast('Move the stick to an answer first');
        return qbAnswer(PAD.hover);
      }
      return qbNext(1);
    }
    if(act==='next'&&QB.answers[QB.i]!==undefined)return qbNext(1);
    if(act==='back')return qbNext(-1);
    if(act==='end'){QB.setup=true;return render()}
  }
  if(view.mode==='seq'&&!SEQ.setup&&!SEQ.over){
    if(SEQ.hidden){
      if(SEQ.picked===null){
        if(act==='confirm'||act==='next'||act[0]==='o')return seqReveal();
      }else{
        if(act==='confirm'||act==='next')return seqGrade(true);
        if(act==='back')return seqGrade(false);
      }
      if(act==='end'){SEQ.setup=true;return render()}
      return;
    }
    if(act[0]==='o'&&SEQ.picked===null){const k=+act[1]-1;if(k<SEQ.opts.length)seqPick(k);return}
    if(act==='confirm'){
      if(SEQ.picked!==null)return seqNext();
      if(PAD.hover!==null)return seqPick(PAD.hover);
      return toast('Aim with the stick first');
    }
    if(act==='next'&&SEQ.picked!==null)return seqNext();
    if(act==='end'){SEQ.setup=true;return render()}
  }
}
function padPoll(){
  const pads=padList();
  const gp=pads.find(p=>PAD.idx===null||p.index===PAD.idx)||pads[0];
  if(gp){
    if(PAD.idx===null)PAD.idx=gp.index;
    const pressed=[];
    gp.buttons.forEach((b,i)=>{
      const on=b.pressed||b.value>0.5;
      if(on)pressed.push(i);
      if(on&&!PAD.prev[i]){
        if(PAD.binding){G.padMap=Object.assign({},G.padMap,{[PAD.binding]:[i]});PAD.binding=null;save();render()}
        else{
          /* one physical button fires ONE action — sharing a button between
             "Option 1" and "Confirm" made a single press pick and then advance */
          const m=padMap(),act=Object.keys(m).find(a=>m[a].includes(i));
          if(act)padFire(act);
        }
      }
      PAD.prev[i]=on;
    });
    /* stick -> nearest spoke on the radial board */
    const ax=gp.axes||[];
    PAD.axes=[ax[0]||0,ax[1]||0];
    if(PAD.calib){
      let cx=ax[0]||0,cy=ax[1]||0;
      if(Math.hypot(cx,cy)<0.5&&ax.length>3){cx=ax[2]||0;cy=ax[3]||0}
      if(Math.hypot(cx,cy)>0.7){
        /* whatever direction the stick is physically pushed becomes "up" */
        const a=Math.atan2(cy,cx);
        let deg=Math.round((-Math.PI/2-a)*180/Math.PI);
        deg=((deg%360)+360)%360;if(deg>180)deg-=360;
        G.padRot=deg;PAD.calib=false;save();render();
        toast(`Calibrated — rotated ${deg>0?'+':''}${deg}°`);
      }
    }
    /* on the question list the stick steps up and down instead of aiming */
    if(view.mode==='qbank'&&!QB.setup&&QB.qs[QB.i]&&QB.answers[QB.i]===undefined){
      const q=QB.qs[QB.i],n=q.options.length;
      let x=ax[0]||0,y=ax[1]||0;
      if(Math.hypot(x,y)<0.5&&ax.length>3){x=ax[2]||0;y=ax[3]||0}
      [x,y]=padAim(x,y);
      const v=Math.abs(y)>=Math.abs(x)?y:0;
      const now=Date.now();
      if(Math.abs(v)>0.6&&now-(PAD.step||0)>200){
        PAD.step=now;
        PAD.hover=((PAD.hover===null?(v>0?-1:0):PAD.hover)+(v>0?1:-1)+n)%n;
        render();
      }
    }
    if(view.mode==='seq'&&!SEQ.setup&&!SEQ.over&&SEQ.picked===null&&!SEQ.hidden){
      let x=ax[0]||0,y=ax[1]||0;
      if(Math.hypot(x,y)<0.5&&ax.length>3){x=ax[2]||0;y=ax[3]||0}
      [x,y]=padAim(x,y);
      const mag=Math.hypot(x,y);
      if(mag>0.5){
        const a=Math.atan2(y,x),n=SEQ.opts.length;
        let best=null,bd=9;
        for(let i=0;i<n;i++){
          const sa=(i/n)*6.28318-Math.PI/2;
          /* wrapped angular distance in [0, PI] — an earlier version inverted
             this and highlighted the spoke furthest from the stick */
          const d=Math.abs(((a-sa+Math.PI*3)%(Math.PI*2))-Math.PI);
          if(d<bd){bd=d;best=i}
        }
        if(best!==PAD.hover){PAD.hover=best;render()}
      }
      /* deliberately NOT cleared when the stick recentres — you aim, let go,
         then pull the trigger, and the selection has to still be there */
    }
    PAD.live=`${gp.id.slice(0,42)} · buttons ${pressed.join(',')||'—'} · stick ${PAD.axes.map(v=>v.toFixed(2)).join(', ')}`;
    const l=document.getElementById('padlive');if(l)l.textContent=PAD.live;
  }else{
    const l=document.getElementById('padlive');
    if(l)l.textContent='no controller seen yet — press a button on it';
  }
  PAD.raf=requestAnimationFrame(padPoll);
}
function padStart(){if(!PAD.raf)padPoll()}
function padBind(a){PAD.binding=a;render()}
function padReset(){G.padMap={};PAD.idx=null;save();render();toast('Back to the default layout')}
function padPanel(){
  const pads=padList(),m=padMap();
  return `<div class="panel" style="margin-top:12px">
    <div class="panel-h" style="margin-bottom:8px"><h2 style="font-size:15px">Controller</h2>
      <span class="hint" style="margin:0 0 0 auto">${pads.length?esc(pads[0].id.slice(0,44)):'nothing paired yet'}</span></div>
    <div class="hint" style="margin:0 0 10px">Pair the Joy-Con to your computer first (hold the small sync button until the
      lights run), then press any button here so the browser will reveal it. A sideways Joy-Con numbers its buttons oddly,
      so rebind anything that lands wrong. On the Sequences board you can also push the stick toward a spoke and confirm.</div>
    <div class="mono" id="padlive" style="font-size:11.5px;background:var(--surface2);border:1px solid var(--line);
      border-radius:var(--r);padding:7px 9px;margin-bottom:10px">${esc(PAD.live||'press a button on the controller')}</div>
    <div class="mapbar" style="margin-bottom:10px">
      <span class="eyebrow">how are you holding it</span>
      <span class="seg">
        <button class="${padRot()===0?'on':''}" onclick="padSetRot(0)">upright</button>
        <button class="${padRot()===90?'on':''}" onclick="padSetRot(90)">sideways &#9664;</button>
        <button class="${padRot()===-90?'on':''}" onclick="padSetRot(-90)">sideways &#9654;</button>
        <button class="${padRot()===180?'on':''}" onclick="padSetRot(180)">upside down</button>
      </span>
      <button class="mini ${PAD.calib?'on':''}" onclick="padCalibrate()">${PAD.calib?'push the stick UP…':'calibrate'}</button>
      ${padRot()%90?`<span class="hint" style="margin:0">custom ${padRot()}&deg;</span>`:''}
    </div>
    <div class="chips">${PAD_ACTIONS.map(([k,l])=>`<button class="chip ${PAD.binding===k?'on':''}"
      onclick="padBind('${k}')">${l} <b class="mono">${PAD.binding===k?'press a button…':(m[k].length?'btn '+m[k].join('/'):'—')}</b></button>`).join('')}</div>
    <div class="hint" style="margin-top:8px">If the stick aims the wrong way, set how you are holding the controller above,
      or press <b>calibrate</b> and push the stick up. Out of the box: <b>stick</b> aims at a spoke, <b>either trigger</b> chooses it,
      and the <b>left and right shoulders</b> (or d-pad left/right) are back and next. The aim stays put when you let go of
      the stick, so you can line it up and then pull the trigger.</div>
    <div class="actions" style="margin-top:10px;padding-top:10px">
      <button class="btn ghost" onclick="padReset()">Reset layout</button>
      <span class="hint" style="margin:0 0 0 auto">keys 1&ndash;5 and Enter keep working too</span></div>
  </div>`;
}

/* ==================== SEQUENCES ====================
   Start on a term, pick the one relationship that is genuinely in the graph out
   of five, and the node you chose becomes the next centre. Builds a chain of
   true facts rather than testing them one at a time. */
let SEQ={setup:true,center:null,trail:[],opts:[],picked:null,lives:3,score:0,len:8,
         sys:'',top:'',over:false,idx:null,seen:new Set(),dead:false,weak:true,hidden:false};
function seqLoadPrefs(){
  const p=G.seqPrefs||{};
  if(typeof p.sys==='string')SEQ.sys=p.sys;
  if(typeof p.top==='string')SEQ.top=p.top;
  if(Number.isFinite(+p.len)&&+p.len>0)SEQ.len=+p.len;
  if(typeof p.weak==='boolean')SEQ.weak=p.weak;
  if(typeof p.hidden==='boolean')SEQ.hidden=p.hidden;
}
function seqStorePrefs(){
  G.seqPrefs={sys:SEQ.sys||'',top:SEQ.top||'',len:SEQ.len||8,weak:!!SEQ.weak,hidden:!!SEQ.hidden};
}
function seqSavePrefsFromSetup(){
  const sys=document.getElementById('sq-sys'),top=document.getElementById('sq-top'),len=document.getElementById('sq-len'),wk=document.getElementById('sq-weak'),hd=document.getElementById('sq-hidden');
  if(sys)SEQ.sys=sys.value||'';if(top)SEQ.top=top.value||'';if(len&&+len.value>0)SEQ.len=+len.value;
  if(wk)SEQ.weak=!!wk.checked;if(hd)SEQ.hidden=!!hd.checked;
  seqStorePrefs();save();
}
function openSEQ(){if(SEQ.setup||SEQ.over)seqLoadPrefs();view={mode:'seq'};render();}
function seqPass(d){return d&&(!SEQ.sys||d.system===SEQ.sys)&&(!SEQ.top||d.topic===SEQ.top)}
/* QBank already resurfaces what you have missed; Sequences used to start anywhere,
   which meant a run could spend eight hops in a region you already know. */
function seqNodeWeight(id){
  if(!SEQ.weak)return 1;
  const n=(G.nodeStats||{})[nodeKey(id)];
  if(!n||!(n.right+n.wrong))return 3;                 /* never tested — worth visiting */
  const acc=n.right/(n.right+n.wrong);
  return acc<0.4?6:acc<0.7?4:acc<0.9?2:1;
}
function seqEdgeWeight(o){
  if(!SEQ.weak||!o||!o.id)return 1;
  const r=G.rels.find(x=>x.id===o.id);if(!r)return 1;
  const st=(G.stats||{})[QK.rel(r)];
  if(!st||!(st.right+st.wrong))return 2;
  return st.wrong>st.right?5:st.wrong?3:1;
}
function seqEdgesOf(id){
  const out=[];
  (SEQ.idx.subj[id]||[]).forEach(r=>{if(!r.neg&&byId(r.bId))out.push({rel:r.relation,other:r.bId,dir:'out',id:r.id})});
  (SEQ.idx.obj[id]||[]).forEach(r=>{if(!r.neg&&byId(r.aId))out.push({rel:r.relation,other:r.aId,dir:'in',id:r.id})});
  const seen=new Set();
  return out.filter(e=>{const k=e.rel+'|'+e.other+'|'+e.dir;if(seen.has(k))return false;seen.add(k);return true});
}
/* Some relations are transitive: neutrophil is_a granulocyte is_a leukocyte
   makes "neutrophil is_a leukocyte" true even though no direct edge exists.
   Any option a chain can justify must not be offered as a wrong answer. */
const CHAIN={is_a:['is_a','subtype_of','member_of'],subtype_of:['is_a','subtype_of','member_of'],
  member_of:['is_a','subtype_of','member_of'],is_part_of:['is_part_of'],composed_of:['composed_of'],
  located_in:['located_in','inside_of'],inside_of:['located_in','inside_of'],
  survives_in:['survives_in','located_in','inside_of'],contains:['contains'],
  required_for:['required_for'],derived_from:['derived_from'],
  superior_to:['superior_to'],inferior_to:['inferior_to'],proximal_to:['proximal_to'],distal_to:['distal_to']};
function derivable(fromId,rel,toId,idx){
  const set=CHAIN[rel];if(!set)return false;
  const I=idx||QBIDX||SEQ.idx;if(!I)return false;
  const seen=new Set([fromId]);let front=[fromId];
  for(let d=0;d<6&&front.length;d++){
    const next=[];
    front.forEach(id=>(I.subj[id]||[]).forEach(r=>{
      if(r.neg||!set.includes(r.relation)||seen.has(r.bId))return;
      seen.add(r.bId);next.push(r.bId);
    }));
    if(seen.has(toId))return true;
    front=next;
  }
  return seen.has(toId);
}
/* Attributes travel DOWN a taxonomy: Neisseria is_a cocci, and cocci are
   classified_by Gram stain, so "Neisseria classified_by Gram stain" is true even
   though no direct edge exists. Taxonomic relations are excluded here — sharing a
   parent makes two nodes siblings, not one a kind of the other — and those are
   already covered by derivable(). */
function inherited(cId,rel,tId,dir,idx){
  if(TAXR.includes(rel))return false;
  const I=idx||QBIDX||SEQ.idx;if(!I||!I.anc)return false;
  /* attributes travel DOWN to the subject: what is true of cocci is true of Neisseria */
  const subs=[cId,...I.anc(cId)];
  /* and UP from the object: "contains type 4 pili" makes "contains pili" true,
     because a type 4 pilus IS a pilus */
  const objs=[tId,...(I.desc?I.desc(tId):[])];
  for(const a of subs)for(const t of objs){
    if(a===cId&&t===tId)continue;                 /* the direct edge is handled elsewhere */
    if(dir==='in'){
      if((I.obj[a]||[]).some(r=>!r.neg&&r.relation===rel&&r.aId===t))return true;
    }else{
      if((I.subj[a]||[]).some(r=>!r.neg&&r.relation===rel&&r.bId===t))return true;
    }
  }
  return boundTrue(cId,rel,tId,dir,I);
}
/* A disease and the organism that causes it are bound tightly enough that a
   student transfers attributes between them without noticing. "cholera has the
   property curved Gram-negative rod" is false of the disease and true of the
   bug, which makes it an unfair distractor rather than a wrong answer. The same
   goes for a drug and its class: doxycycline IS a tetracycline. */
const BOUND_REL=['causes','derived_from'];
const TRANSFERABLE=['has_property','located_in','produces','contains','transmitted_by',
  'treated_by','used_for','sensitive_to','resistant_to','survives_in','infects','appears_as','classified_by'];
function boundTrue(cId,rel,tId,dir,I){
  if(!TRANSFERABLE.includes(rel))return false;
  const fam=famOf(rel).key;
  const partners=new Set();
  (I.subj[cId]||[]).forEach(r=>{if(!r.neg&&BOUND_REL.includes(r.relation))partners.add(r.bId)});
  (I.obj[cId]||[]).forEach(r=>{if(!r.neg&&BOUND_REL.includes(r.relation))partners.add(r.aId)});
  /* the drug/class case: anything true of an ancestor of the OPTION counts too */
  const tSide=[tId,...(I.anc?I.anc(tId):[])];
  /* within one family the wording flips freely — "treated_by" and "used_for" are
     the same claim from opposite ends — so look for a link in either direction */
  const famLink=(a,b)=>(I.subj[a]||[]).some(r=>!r.neg&&famOf(r.relation).key===fam&&r.bId===b)
    ||(I.obj[a]||[]).some(r=>!r.neg&&famOf(r.relation).key===fam&&r.aId===b);
  for(const p of partners)for(const t of tSide)if(famLink(p,t))return true;
  for(const t of tSide){if(t!==tId&&famLink(cId,t))return true}
  return false;
}
function seqFakes(centerId,realOther,n){
  const near=SEQ.idx.nbr[centerId]||new Set();
  const c=byId(centerId)||{};
  const banned=id=>id===centerId||id===realOther||near.has(id)||SEQ.seen.has(id)
    ||!byId(id)||byId(id).stub;
  /* nearest first: two hops out, then the same topic, then the same system */
  const t2=new Set();
  near.forEach(a=>(SEQ.idx.nbr[a]||new Set()).forEach(b=>{if(!banned(b))t2.add(b)}));
  const tiers=[
    [...t2],
    G.defs.filter(d=>!banned(d.id)&&d.topic&&d.topic===c.topic).map(d=>d.id),
    G.defs.filter(d=>!banned(d.id)&&d.system&&d.system===c.system).map(d=>d.id),
    G.defs.filter(d=>!banned(d.id)).map(d=>d.id)];
  /* Draw a MIX rather than draining the nearest ring first — always picking
     two-hop neighbours made every option feel like a near-duplicate. Roughly
     two from close by, one from the topic, one from further out. */
  const seenC=new Set(),picked=[[],[],[],[]];
  tiers.forEach((t,i)=>shuffle(t).forEach(id=>{if(!seenC.has(id)){seenC.add(id);picked[i].push(id)}}));
  const quota=[2,1,1,1],cands=[];
  quota.forEach((q,i)=>{for(let k=0;k<q;k++)if(picked[i].length)cands.push(picked[i].shift())});
  /* then whatever is left, still nearest-first, to cover thin topics */
  picked.forEach(t=>t.forEach(id=>cands.push(id)));
  /* and give the fake a relation that term genuinely takes in that role
     elsewhere, so "cell wall is used for X" cannot give itself away */
  const relFor=tid=>{
    const asObj=[...new Set((SEQ.idx.obj[tid]||[]).filter(r=>!r.neg).map(r=>r.relation))];
    const asSub=[...new Set((SEQ.idx.subj[tid]||[]).filter(r=>!r.neg).map(r=>r.relation))];
    const opts=[];
    asObj.forEach(r=>{if(!derivable(centerId,r,tid,SEQ.idx)&&!inherited(centerId,r,tid,'out',SEQ.idx))opts.push({rel:r,dir:'out'})});

/* A cumulative graph of the questions in the current run. It deliberately keeps
   the current answer hidden: before a question is answered, the side graph gets
   a dashed ? node but not the true relationship or destination. */
function seqNetWrap(text,max){
  const t=String(text||'');if(t.length<=max)return [t];
  const words=t.replace(/([_/-])/g,'$1 ').split(/\s+/).filter(Boolean),out=[];let cur='';
  for(const w of words){const n=cur?(cur+' '+w):w;if(n.length>max&&cur){out.push(cur);cur=w}else cur=n;if(out.length===1&&cur.length>max)break}
  if(cur)out.push(cur);if(out.length>2){out[1]+='…';out.length=2}return out.map(x=>x.length>max+5?x.slice(0,max+4)+'…':x);
}
function seqNetModel(){
  const nodes=[],edges=[],seen=new Set();
  const add=id=>{if(!id||seen.has(id))return;seen.add(id);nodes.push({id,label:termOf(id),pending:false})};
  SEQ.trail.forEach((st,i)=>{add(st.from);add(st.to);edges.push({...st,q:i+1,pending:false})});
  if(!SEQ.over){
    add(SEQ.center);
    const q=SEQ.trail.length+1,truth=(SEQ.picked!==null)?SEQ.opts.find(o=>o.ok):null;
    if(truth){add(truth.other);edges.push({from:SEQ.center,to:truth.other,rel:truth.rel,dir:truth.dir,q,pending:false,current:true})}
    else{const pid='__seq_pending__';nodes.push({id:pid,label:'?',pending:true});edges.push({from:SEQ.center,to:pid,rel:'',dir:'out',q,pending:true,current:true})}

  const es=M.edges.map(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return '';let s=a,t=b;if(e.dir==='in'){s=b;t=a}
    const dx=t.x-s.x,dy=t.y-s.y,L=Math.max(1,Math.hypot(dx,dy)),ux=dx/L,uy=dy/L;
    const x1=s.x+ux*31,y1=s.y+uy*22,x2=t.x-ux*31,y2=t.y-uy*22,mx=(x1+x2)/2,my=(y1+y2)/2;

  t+=`\n  semantic relation: ${r.relation}`;
  if(r.neg)t+=`\n  POLARITY: NEGATIVE. The graph asserts this relation does NOT hold. Do not invert this; a correct item may use it as a distractor or test the absence directly.`;
  if(r.effect&&r.effect.entityId)t+=`\n  effect: ${r.effect.neg?'does NOT ':''}${r.effect.relation} ${termOf(r.effect.entityId)}`;
  (r.conditions||[]).forEach(c=>t+=`\n  condition (${c.type}): ${c.entityId?termOf(c.entityId):''}${c.note?' — '+c.note:''}`);

function relEdges(id){
  const out=[];
  G.rels.forEach(r=>{
    if(r.aId===id)out.push({other:r.bId,rel:r.relation,neg:!!r.neg,dir:'out',r});
    else if(r.bId===id)out.push({other:r.aId,rel:r.relation,neg:!!r.neg,dir:'in',r});
    else if(r.effect&&r.effect.entityId===id)out.push({other:r.aId,rel:r.effect.relation,neg:!!r.effect.neg,dir:'in',r});
    else if((r.conditions||[]).some(c=>c.entityId===id))out.push({other:r.aId,rel:'condition',neg:false,dir:'in',r});
  });
  if(MAP.mentions){
    ((byId(id)||{}).termLinks||[]).forEach(l=>out.push({other:l,rel:'in name',neg:false,dir:'out',men:true}));
    G.defs.forEach(d=>{if((d.termLinks||[]).includes(id))out.push({other:d.id,rel:'in name',neg:false,dir:'in',men:true})});
    (byId(id)||{features:[]}).features?.forEach(f=>(f.links||[]).forEach(l=>out.push({other:l,rel:'mentions',neg:false,dir:'out',men:true})));
    G.defs.forEach(d=>{if(d.id!==id)(d.features||[]).forEach(f=>{if((f.links||[]).includes(id))out.push({other:d.id,rel:'mentions',neg:false,dir:'in',men:true})})});
  }
  const seen=new Set(),uniq=[];
  out.forEach(e=>{const k=e.other+'|'+e.rel+'|'+e.dir;if(!seen.has(k)&&e.other&&e.other!==id){seen.add(k);uniq.push(e)}});
  return uniq;
}

/* ---------- view 2: cloud regions ----------

const topicOf=d=>((d.system?d.system+' / ':'')+(d.topic||'uncategorised'));
const sysOf=d=>d.system||'uncategorised';
const REGION=['#2B6CB0','#C2255C','#0F766E','#B45309','#6B46C1','#15803D','#A21CAF','#0369A1','#BE123C','#4D7C0F'];

/* convex hull, monotone chain */
function hull(P){

  const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);

  p.forEach(q=>{while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)});
  p.slice().reverse().forEach(q=>{while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)});
