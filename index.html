/* push the hull outward and round it off into a cloud */
const _blobCache=new Map();
function blobPath(P,pad){

            Math.round(P[P.length-1].x)+','+Math.round(P[P.length-1].y);
  const hit=_blobCache.get(key);
  if(hit)return hit;

  let H=hull(P).map(p=>{const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy)||1;
    return {x:p.x+dx/d*pad,y:p.y+dy/d*pad}});
  if(H.length<3){const r=pad+26;return `M ${cx-r} ${cy} a ${r} ${r} 0 1 0 ${r*2} 0 a ${r} ${r} 0 1 0 ${-r*2} 0`}
  let d=`M ${(H[0].x+H[H.length-1].x)/2} ${(H[0].y+H[H.length-1].y)/2}`;
  for(let i=0;i<H.length;i++){

/* deterministic relaxation of the territories themselves */
/* Pack provinces INSIDE their territory rather than around its rim: start on a

   overlapping ones push apart, and everything is kept within the outer circle. */
const _packCache=new Map();
/* ---------- nested territories ----------
   "@@ micro / bacteriology / gram positive" should draw three rings, not two.
   Build a tree from the paths, size every branch from the area its children need,
   then pack each level inside its parent. */
function buildTree(){
  const root={key:'',name:'',depth:0,kids:new Map(),nodes:[]};
  G.defs.forEach(d=>{
    const path=(d.path&&d.path.length)?d.path
      :[d.system||'uncategorised',...String(d.topic||'').split(' / ')].filter(Boolean);
    if(!path.length)path.push('uncategorised');
    let cur=root;
    path.forEach((seg,i)=>{
      if(!cur.kids.has(seg))cur.kids.set(seg,{key:cur.key+'\u0000'+seg,name:seg,

      cur=cur.kids.get(seg);

    n.children=[...n.kids.values()];

    const own=n.nodes.length?22+Math.sqrt(n.nodes.length)*10.5:0;
    if(!n.children.length){n.r=Math.max(26,own);return}
    const area=n.children.reduce((s,c)=>s+c.r*c.r,0)+own*own*0.5;

function packTopics(tps,R,links){

      const want=tps[i].r+tps[j].r+16;

      const d=Math.hypot(P[i].x,P[i].y),lim=Math.max(0,R-tps[i].r-7);

  const n=rs.length;
  const P=rs.map((r,i)=>({x:Math.cos(i/n*6.28318)*(180+n*14),y:Math.sin(i/n*6.28318)*(180+n*14),r:r.R}));

    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      const a=P[i],b=P[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||0.01;

function allEdges(){

    if(r.effect&&r.effect.entityId)out.push({a:r.bId,b:r.effect.entityId,c:famOf(r.effect.relation).color,neg:!!r.effect.neg,kind:'rel',src:r});

    if(lod<3){
      const A=pos[r.a],B=pos[r.b];
      if(!A||!B)return;
      const cross=A.sy!==B.sy;
      if(!cross&&lod<2)return;                           /* only inter-system arcs */
      if(!cross&&!(keep.has(r.a)&&keep.has(r.b)))return; /* both ends must be drawn */
      if(cross&&r.kind!=='rel'&&lod<2)return;
    }
    const a=pos[r.a],b=pos[r.b];if(!a||!b)return;
    if(!live(a.sy)&&!live(b.sy))return;
    let col=r.c,dash=r.neg?'stroke-dasharray="4 3"':'';
    let w=r.kind==='rel'?1:0.75,op=r.kind==='rel'?1:0.55;
    if(mastery){
      const v=edgeScore(r.src);
      if(v===null)return;          /* never asked about — do not draw it */
      col=grad(v);w=1.6;op=1.35;
    }
    if(a.tp===b.tp&&a.sy===b.sy)
      e1+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="${.9*w}" opacity="${(showing?0.4:0.16)*op*fade(a,b)}" ${dash}/>`;
    else if(a.sy===b.sy)
      e2+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="${1.2*w}" opacity="${.34*op*fade(a,b)}" ${dash}/>`;
    else{
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y;
      e3+=`<path d="M ${a.x} ${a.y} Q ${mx-dy*0.15} ${my+dx*0.15} ${b.x} ${b.y}" fill="none"
        stroke="${col}" stroke-width="${1.5*w}" opacity="${.4*op*fade(a,b)}" ${dash}/>`;
    }
  });
  const dots=G.defs.map(d=>{
    const p=pos[d.id];if(!p)return '';
    if(lod<3&&!keep.has(d.id))return '';
    const deg=conn[d.id]||0,on=live(p.sy);
    let r=2.3+Math.min(7,Math.sqrt(deg)*1.7),fill=d.stub?'#fff':p.col,stroke=p.col,sw=d.stub?1.2:0,dash=d.stub?'stroke-dasharray="2 1.5"':'';
    if(mastery){
      const v=nodeScore(d.id),n=(G.nodeStats||{})[nodeKey(d.id)]||{right:0,wrong:0};
      stroke=grad(v);
      if(v===null){fill='none';sw=1;dash='stroke-dasharray="1.5 1.5"';r=2.4}
      else{fill=stroke;sw=0;dash='';r=3+Math.min(7,Math.sqrt(n.right+n.wrong)*2.2)}
    }
    const lab=showing===p.sy?deg>=2:deg>=7;
    return `<g style="cursor:pointer" opacity="${on?1:0.14}" onclick="MAP.focusId='${d.id}';selected='${d.id}';MAP.mode='focus';render()">
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${dash}/>
      ${!deg&&!mastery?`<circle cx="${p.x}" cy="${p.y}" r="${r+3.5}" fill="none" stroke="#B91C1C" stroke-width="1" opacity=".55"/>`:''}
      ${lab?`<text x="${p.x}" y="${p.y-r-3}" text-anchor="middle" font-family="IBM Plex Mono,monospace"
        font-size="9" fill="#12171C">${svgEsc(d.term.length>20?d.term.slice(0,19)+'…':d.term)}</text>`:''}</g>`;
  }).join('');
  const unc=G.defs.filter(d=>!d.system&&!d.topic).length;
  /* frame whatever the tree actually occupies */
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  boxes.forEach(n=>{if(!n.depth)return;
    bx0=Math.min(bx0,n.x-n.r);by0=Math.min(by0,n.y-n.r);
    bx1=Math.max(bx1,n.x+n.r);by1=Math.max(by1,n.y+n.r);});
  if(bx0>bx1){bx0=by0=-300;bx1=by1=300}
  const pad=70,x0=bx0-pad,y0=by0-pad-24,w=(bx1-bx0)+pad*2,h=(by1-by0)+pad*2+24;
  MAP.vb={x:x0,y:y0,w,h};
  return `<svg id="regsvg" viewBox="${x0} ${y0} ${w} ${h}"
      style="width:100%;height:72vh;display:block;cursor:grab;touch-action:none">
      <g id="regg" transform="translate(${MAP.tx} ${MAP.ty}) scale(${MAP.k})">
      ${outer}${inner}${e1}${e2}${e3}${dots}${innerLabels}</g></svg>
    <div class="hint">${['showing territories only — zoom in for nodes','showing the busiest nodes','showing most nodes','showing everything'][lod]} ·
      dashed outline = system · solid outline = topic packed inside it · dots sized by connections ·
      arcs cross between systems · a red ring means genuinely unconnected (${lone} of ${G.defs.length}) ·
      click a system to isolate it, click a dot to open it${showing?` · <b>showing ${esc(showing)}</b>`:''}
      ${unc?` <b style="color:var(--stub)">· ${unc} nodes have no topic — press Relink graph in Compose to file them</b>`:''}</div>`;
}
function jumpTopic(k){
  const ids=G.defs.filter(d=>topicOf(d)===k).map(d=>d.id);
  if(!ids.length)return;

/* ---------- view 3: mastery ----------
   The same territories, recoloured by answer history. Grey means never tested,
   which is a different and more actionable thing than "wrong". */
function nodeScore(id){
  const n=(G.nodeStats||{})[nodeKey(id)]||(G.nodeStats||{})[id];
  if(!n||!(n.right+n.wrong))return null;
  return n.right/(n.right+n.wrong);
}
/* continuous red -> amber -> green rather than three buckets */
function grad(v){
  if(v===null||v===undefined)return '#C7CDD4';
  const x=Math.max(0,Math.min(1,v));
  const h=Math.round(x*128);                 /* 0 red .. 128 green */
  const l=Math.round(46-Math.abs(x-0.5)*10); /* dip lightness at the ends */
  return `hsl(${h} ${Math.round(58+Math.abs(x-0.5)*22)}% ${l}%)`;
}
const SCORECOL=grad;
/* an edge counts as tested only if a question was actually asked about it */
function edgeScore(r){
  if(!r)return null;
  const st=G.stats||{};
  const keys=[QK.rel(r),QK.relr(r)];
  if(r.slot){const a=byId(r.aId),b=byId(r.bId);
    if(a)keys.push(QK.slot(a,r.slot));if(b)keys.push(QK.slot(b,r.slot));}
  (r.conditions||[]).forEach((c,i)=>keys.push(QK.cond(r,i)));
  if(r.neg)keys.push(QK.neg(r));
  let right=0,wrong=0,any=false;
  keys.forEach(k=>{const x=st[k];if(x&&(x.right+x.wrong)){any=true;right+=x.right;wrong+=x.wrong}});
  return any?right/(right+wrong):null;
}
function masterySVG(){
  if(!G.defs.length)return '<div class="empty">Nothing committed yet.</div>';
  const tested=G.defs.filter(d=>nodeScore(d.id)!==null);
  const out=overviewSVG(true);

  const byTop={};
  G.defs.forEach(d=>{
    const k=(d.system||'uncategorised')+' / '+(d.topic||'general');
    const n=(G.nodeStats||{})[nodeKey(d.id)];
    const o=byTop[k]=byTop[k]||{n:0,seen:0,right:0,wrong:0};
    o.n++;if(n&&(n.right+n.wrong)){o.seen++;o.right+=n.right;o.wrong+=n.wrong}
  });
  const rows=Object.entries(byTop).filter(([,o])=>o.seen)
    .map(([k,o])=>({k,...o,acc:o.right/(o.right+o.wrong),cov:o.seen/o.n}))
    .sort((a,b)=>a.acc-b.acc);
  const worst=G.defs.map(d=>({d,v:nodeScore(d.id),n:(G.nodeStats||{})[nodeKey(d.id)]}))
    .filter(x=>x.v!==null&&x.v<0.6).sort((a,b)=>a.v-b.v).slice(0,24);
  const totR=Object.values(G.nodeStats||{}).reduce((n,x)=>n+x.right,0);
  const totW=Object.values(G.nodeStats||{}).reduce((n,x)=>n+x.wrong,0);
  return `${out}
  <div class="panel" style="margin-top:12px">
    <div style="display:flex;gap:22px;flex-wrap:wrap;align-items:baseline">
      <span><b class="mono" style="font-size:26px">${totR+totW?Math.round(totR/(totR+totW)*100):0}%</b>
        <span class="eyebrow">overall</span></span>
      <span><b class="mono" style="font-size:26px">${tested.length}</b>
        <span class="eyebrow">of ${G.defs.length} nodes ever tested</span></span>
      <span><b class="mono" style="font-size:26px">${Math.round(tested.length/G.defs.length*100)}%</b>
        <span class="eyebrow">coverage</span></span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap">
      <span class="eyebrow">0%</span>
      <span style="flex:1;min-width:180px;max-width:320px;height:10px;border-radius:5px;
        background:linear-gradient(to right,${[0,.15,.3,.45,.6,.75,.9,1].map(v=>grad(v)).join(',')})"></span>
      <span class="eyebrow">100%</span>
      <span style="display:inline-flex;align-items:center;gap:6px;margin-left:8px">
        <span style="width:11px;height:11px;border-radius:50%;border:1px dashed #C7CDD4"></span>
        <span class="hint" style="margin:0">never tested</span></span>
      <span class="hint" style="margin:0">dot size = times asked · only edges you have actually been questioned on are drawn</span>
    </div>
    ${rows.length?`<div class="sect"><span class="eyebrow">By topic — weakest first</span><span class="ln"></span></div>
    <table class="syn" style="table-layout:auto">${rows.map(r=>`<tr>
      <td style="white-space:nowrap"><b class="mono" style="color:${SCORECOL(r.acc)}">${Math.round(r.acc*100)}%</b></td>
      <td style="width:100%">
        <div style="display:flex;align-items:center;gap:9px">
          <div style="flex:1;height:7px;background:var(--line2);border-radius:4px;overflow:hidden;max-width:220px">
            <div style="height:7px;width:${r.acc*100}%;background:${SCORECOL(r.acc)}"></div></div>
          <span>${esc(r.k)}</span>
          <span class="hint" style="margin:0">${r.seen}/${r.n} tested · ${r.right+r.wrong} answers</span>
        </div></td></tr>`).join('')}</table>`
    :'<div class="hint" style="margin-top:12px">No answer history yet — run a QBank set and this fills in.</div>'}
    ${worst.length?`<div class="sect"><span class="eyebrow">Weakest facts</span><span class="ln"></span></div>
      <div class="chips">${worst.map(x=>`<button class="chip" onclick="pick('${x.d.id}')">
        ${esc(x.d.term)} <b class="mono" style="color:${SCORECOL(x.v)}">${x.n.right}/${x.n.right+x.n.wrong}</b></button>`).join('')}</div>
      <div class="actions"><button class="btn" onclick="QB.weak=true;QB.setup=true;openQB()">Drill these in QBank</button></div>`:''}
  </div>`;
}

         <span class="hint" style="margin:0 0 0 6px">missing ${o.miss.map(m=>esc(m.label.toLowerCase())).join(', ')}</span></div>`).join('')}</div>`;

function mapApply(){

/* Zoom only moves the viewBox, so crossing into a new detail band has to redraw —
   otherwise you would zoom in and find nothing new appeared. */
let _lodT=null,_lodAt=null;
function lodCheck(){
  const now=mapLOD();
  if(_lodAt===null){_lodAt=now;return}
  if(now===_lodAt)return;
  clearTimeout(_lodT);
  _lodT=setTimeout(()=>{if(mapLOD()!==_lodAt){_lodAt=mapLOD();render()}},160);
}
function mapZoom(f,px,py){
  const svg=document.getElementById('regsvg');if(!svg||!MAP.vb)return;
  const r=svg.getBoundingClientRect();
  const sx=px===undefined?r.width/2:px, sy=py===undefined?r.height/2:py;
  /* the parent-space point under the cursor must stay put while k changes */
  const P={x:MAP.vb.x+sx/r.width*MAP.vb.w, y:MAP.vb.y+sy/r.height*MAP.vb.h};
  const u={x:(P.x-MAP.tx)/MAP.k, y:(P.y-MAP.ty)/MAP.k};
  MAP.k=Math.max(0.35,Math.min(9,MAP.k*f));
  MAP.tx=P.x-MAP.k*u.x; MAP.ty=P.y-MAP.k*u.y;
  lodCheck();
  mapApply();
}
function initMap(){
  const svg=document.getElementById('regsvg');
  if(!svg||!MAP.vb)return;
  let drag=null,pinch=null;
  const unit=()=>{const r=svg.getBoundingClientRect();return MAP.vb.w/r.width};
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=svg.getBoundingClientRect();
    mapZoom(e.deltaY<0?1.14:1/1.14, e.clientX-r.left, e.clientY-r.top);
  },{passive:false});
  svg.addEventListener('mousedown',e=>{
    drag={x:e.clientX,y:e.clientY,tx:MAP.tx,ty:MAP.ty};
    MAP.moved=false;svg.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4)MAP.moved=true;
    const s=unit();
    MAP.tx=drag.tx+dx*s;MAP.ty=drag.ty+dy*s;mapApply();
  });
  window.addEventListener('mouseup',()=>{drag=null;svg.style.cursor='grab'});
  /* a drag must not count as a click on whatever was under the pointer */
  svg.addEventListener('click',e=>{
    if(MAP.moved){e.stopPropagation();e.preventDefault();MAP.moved=false}
  },true);
  /* touch: one finger pans, two fingers pinch */
  const mid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  svg.addEventListener('touchstart',e=>{
    if(e.touches.length===1){const t=e.touches[0];drag={x:t.clientX,y:t.clientY,tx:MAP.tx,ty:MAP.ty};MAP.moved=false}
    else if(e.touches.length===2){pinch={d:dist(e.touches),k:MAP.k};drag=null;MAP.moved=true}
  },{passive:true});
  svg.addEventListener('touchmove',e=>{
    if(pinch&&e.touches.length===2){
      e.preventDefault();
      const r=svg.getBoundingClientRect(),m=mid(e.touches);
      const want=pinch.k*(dist(e.touches)/pinch.d);
      mapZoom(want/MAP.k, m.x-r.left, m.y-r.top);
    }else if(drag&&e.touches.length===1){
      e.preventDefault();
      const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y;
      if(Math.abs(dx)+Math.abs(dy)>4)MAP.moved=true;
      const s=unit();MAP.tx=drag.tx+dx*s;MAP.ty=drag.ty+dy*s;mapApply();
    }
  },{passive:false});
  svg.addEventListener('touchend',e=>{if(e.touches.length===0){drag=null;pinch=null}});
}

let WB_MODULE_PROMISE_V11=null;
let WB_MODULE_READY_V11=false;
function ensureWhiteboardModuleV11(){
  if(WB_MODULE_READY_V11)return Promise.resolve(true);
  if(WB_MODULE_PROMISE_V11)return WB_MODULE_PROMISE_V11;
  WB_MODULE_PROMISE_V11=new Promise((resolve,reject)=>{
    const load=src=>new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=ok;s.onerror=()=>bad(new Error('Could not load '+src));document.head.appendChild(s)});
    load('./stroke-sequence.js?v=12.3').then(()=>load('./whiteboard-module.js?v=12.3')).then(()=>{WB_MODULE_READY_V11=true;resolve(true)}).catch(e=>{WB_MODULE_PROMISE_V11=null;reject(e)});
  });
  return WB_MODULE_PROMISE_V11;
}
async function openWhiteboard(){
  try{
    await ensureWhiteboardModuleV11();
    return window.openWhiteboardLoadedV11();
  }catch(e){console.error(e);toast('Could not load Whiteboard');}
}
async function openTrainer(){
  try{
    await ensureWhiteboardModuleV11();
    return window.openTrainerLoadedV11();
  }catch(e){console.error(e);toast('Could not load Ink Trainer');}
}



/* ==================== V11 MODULAR INK LAB BRIDGE ====================
   - Main MedGraph does not parse Whiteboard/recognition code at startup.
   - Ink Lab loads in a same-page iframe overlay.
   - Whiteboard code loads only when Whiteboard/inline Ink Trainer is opened.
===================================================================== */
let INK_LAB_LOADED_V11=false;
let INK_CLOSE_TIMER_V11=null;

function openInkLabV11(){
  const shell=document.getElementById('v10-ink-shell'),
        frame=document.getElementById('v10-ink-frame'),
        status=document.getElementById('v10-ink-status');
  if(!shell||!frame)return;
  shell.classList.add('open');
  shell.setAttribute('aria-hidden','false');
  if(!INK_LAB_LOADED_V11){
    INK_LAB_LOADED_V11=true;
    if(status)status.textContent='opening…';
    frame.src='./handwriting-lab.html?v=11';
  }else if(status){
    status.textContent='ready';
  }
}
function goInkLabV9(){openInkLabV11()}

async function refreshHandwritingAfterLabV11(){
  if(typeof window.mgV11ReloadCanonicalFromStore==='function'){
    try{await window.mgV11ReloadCanonicalFromStore()}catch(e){console.error(e)}
  }
}

function finishInkLabCloseV11(label='saved'){
  clearTimeout(INK_CLOSE_TIMER_V11);
  const shell=document.getElementById('v10-ink-shell'),
        status=document.getElementById('v10-ink-status'),
        btn=document.getElementById('v10-ink-back');
  if(shell){
    shell.classList.remove('open');
    shell.setAttribute('aria-hidden','true');
  }
  if(status)status.textContent=label;
  if(btn){
    btn.disabled=false;
    btn.dataset.force='';
    btn.textContent='← Back to MedGraph';
  }
  refreshHandwritingAfterLabV11();
}
function requestInkLabCloseV10(){
  const frame=document.getElementById('v10-ink-frame'),
        btn=document.getElementById('v10-ink-back'),
        status=document.getElementById('v10-ink-status');
  if(btn?.dataset.force==='1'){
    finishInkLabCloseV11('force closed · last completed save kept');
    return;
  }
  if(btn)btn.disabled=true;
  if(status)status.textContent='saving Ink Lab…';
  try{
    frame?.contentWindow?.postMessage({type:'medgraph-request-ink-close-v11'},location.origin);
  }catch(e){}
  clearTimeout(INK_CLOSE_TIMER_V11);
  INK_CLOSE_TIMER_V11=setTimeout(()=>{
    /* A large dirty corpus can legitimately take longer on iPad. Do not close
       automatically and risk dropping the newest unsaved batch. */
    if(status)status.textContent='still saving… wait, or force close only if Ink Lab is frozen';
    if(btn){
      btn.disabled=false;
      btn.dataset.force='1';
      btn.textContent='Force close';
    }
  },8000);
}
window.addEventListener('message',e=>{
  if(e.origin!==location.origin)return;
  const d=e.data||{},
        status=document.getElementById('v10-ink-status');
  if(d.type==='medgraph-ink-ready-v11'){
    if(status)status.textContent=`ready · ${d.count||0} samples`;
  }else if(d.type==='medgraph-ink-saved-v11'){
    if(status)status.textContent=`saved · ${d.count||0} samples`;
  }else if(d.type==='medgraph-close-ink-v11'){
    finishInkLabCloseV11(`saved · ${d.count||0} samples`);
  }
});

/* Export/import only loads the handwriting runtime when a file actually needs it. */
const _exportJSONV11=exportJSON;
exportJSON=async function(){
  try{await ensureWhiteboardModuleV11()}catch(e){console.error(e)}
  return _exportJSONV11();
};
const _importTextV11=importText;
importText=async function(txt){
  let x=null;
  try{x=JSON.parse(txt)}catch(e){return _importTextV11(txt)}
  const hasTraining=!!(x?.whiteboard?.training?.samples?.length || x?.training?.samples?.length || x?.samples?.length);
  if(hasTraining){
    try{await ensureWhiteboardModuleV11()}catch(e){console.error(e)}
  }
  return _importTextV11(txt);
};


/* ==================== BOOT ==================== */
/* Answer without touching the screen. A Bluetooth clicker or presenter remote
   shows up as a keyboard, so these shortcuts make one work with no pairing code
   in the app at all — remotes usually send PageUp/PageDown or the arrow keys. */
document.addEventListener('keydown',e=>{
  const t=e.target||{},tag=(t.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||t.isContentEditable)return;
  const NEXT=['Enter',' ','ArrowRight','PageDown','n'],BACK=['ArrowLeft','PageUp','p'];
  if(view.mode==='qbank'&&!QB.setup){
    const i='12345'.indexOf(e.key);
    const j='abcde'.indexOf((e.key||'').toLowerCase());
    const q=QB.qs[QB.i];
    if(q&&QB.answers[QB.i]===undefined&&(i>=0||j>=0)){
      const k=i>=0?i:j;
      if(k<q.options.length){e.preventDefault();qbAnswer(k);return}
    }
    if(NEXT.includes(e.key)&&QB.answers[QB.i]!==undefined){e.preventDefault();qbNext(1);return}
    if(BACK.includes(e.key)){e.preventDefault();qbNext(-1);return}
    if(e.key==='Escape'){e.preventDefault();QB.setup=true;render();return}
  }
  if(view.mode==='seq'&&!SEQ.setup&&!SEQ.over){
    if(SEQ.hidden){
      if(SEQ.picked===null&&(NEXT.includes(e.key)||e.key==='1')){e.preventDefault();seqReveal();return}
      if(SEQ.picked!==null){
        if(NEXT.includes(e.key)){e.preventDefault();seqGrade(true);return}
        if(BACK.includes(e.key)||e.key==='Backspace'){e.preventDefault();seqGrade(false);return}
      }
      if(e.key==='Escape'){e.preventDefault();SEQ.setup=true;render();return}
      return;
    }
    const i='12345'.indexOf(e.key);
    if(i>=0&&SEQ.picked===null&&i<SEQ.opts.length){e.preventDefault();seqPick(i);return}
    if(NEXT.includes(e.key)&&SEQ.picked!==null){e.preventDefault();seqNext();return}
    if(e.key==='Escape'){e.preventDefault();SEQ.setup=true;render();return}
  }
  if(!e.altKey||view.mode!=='browse')return;
  if(e.key==='ArrowLeft'){e.preventDefault();navGo(-1)}
  if(e.key==='ArrowRight'){e.preventDefault();navGo(1)}
});

})();
